function advance(day,rec){if(!day||rec==='none')return null;const [y,m,d]=day.split('-').map(Number),x=new Date(Date.UTC(y,m-1,d));if(rec==='daily')x.setUTCDate(x.getUTCDate()+1);else if(rec==='weekly')x.setUTCDate(x.getUTCDate()+7);else if(rec==='monthly'){let mo=m+1,yr=y;if(mo>12){mo=1;yr++}return `${yr}-${String(mo).padStart(2,'0')}-${String(Math.min(d,new Date(Date.UTC(yr,mo,0)).getUTCDate())).padStart(2,'0')}`}return x.toISOString().slice(0,10)}
function quickParse(s){let title=s.trim(),due_date=null,recurrence='none',duration_minutes=30;let date=new Date();if(/\btomorrow\b/i.test(title)){date.setDate(date.getDate()+1);due_date=localDay(date);title=title.replace(/\btomorrow\b/i,'')}else if(/\btoday\b/i.test(title)){due_date=localDay(date);title=title.replace(/\btoday\b/i,'')}const mm=title.match(/\b(\d{1,3})\s*(min(?:ute)?s?|hours?|hrs?)\b/i);if(mm){duration_minutes=+mm[1]*(mm[2].toLowerCase().startsWith('h')?60:1);title=title.replace(mm[0],'')}const r=title.match(/\bevery\s+(day|week|month)\b/i);if(r){recurrence={day:'daily',week:'weekly',month:'monthly'}[r[1].toLowerCase()];title=title.replace(r[0],'')}return {title:title.trim().replace(/\s+/g,' '),due_date,duration_minutes:Math.max(5,Math.min(1440,duration_minutes)),recurrence}}

async function saveTask(d,id=null){if(S.busy)return;S.busy=true;try{let changes={...d,duration_minutes:Math.max(5,Math.min(1440,Number(d.duration_minutes)||30)),due_date:d.due_date||null,reminder_at:d.reminder_at||null};if(!changes.title?.trim())throw Error('Task title is required');if(uid()){let q=id?sb.from('ff5_tasks').update(changes).eq('user_id',uid()).eq('id',id):sb.from('ff5_tasks').insert({...changes,user_id:uid()});const {data,error}=await q.select().single();if(error)throw error;if(id)S.tasks=S.tasks.map(t=>t.id===id?data:t);else S.tasks.unshift(data)}else{if(id)S.tasks=S.tasks.map(t=>t.id===id?{...t,...changes,updated_at:new Date().toISOString()}:t);else S.tasks.unshift({...changes,id:crypto.randomUUID(),user_id:'guest',created_at:new Date().toISOString(),updated_at:new Date().toISOString(),completed_at:null,legacy_id:null})}localSave();closeModal();render();toast(id?'Task updated':'Task added')}catch(e){toast(e.message||'Unable to save task',true)}finally{S.busy=false}}
async function completeTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const done=!t.completed_at,when=done?new Date().toISOString():null;try{if(uid()){const {error}=await sb.from('ff5_tasks').update({completed_at:when}).eq('user_id',uid()).eq('id',id);if(error)throw error}else t.completed_at=when; t.completed_at=when;if(done&&t.recurrence!=='none'){const next=advance(t.due_date||localDay(),t.recurrence);if(next){let nextReminder=null;if(t.reminder_at&&t.due_date){const old=new Date(t.due_date+'T12:00:00').getTime(),nw=new Date(next+'T12:00:00').getTime();nextReminder=new Date(new Date(t.reminder_at).getTime()+nw-old).toISOString()}await saveTask({...draftBase(),title:t.title,notes:t.notes,category:t.category,priority:t.priority,due_date:next,duration_minutes:t.duration_minutes,reminder_at:nextReminder,recurrence:t.recurrence})}}localSave();render()}catch(e){toast(e.message||'Could not update task',true);await loadData()}}

h2>Smart Insights</h2><span class="tag">Personalized</span></div><div class="muted">Today's capacity</div><div class="progress"><div style="width:${pct}%"></div></div><div class="muted">${human(load)} of ${human(cap)} planned</div>${insights()}</section><section class="section"><h2>Plan your day</h2><p class="help">FocusFlow checks upcoming work against your available hours. Customize your daily capacity and get more realistic suggestions.</p><button class="btn secondary" onclick="nav('settings')">Set availability →</button></section></div></div>`}
function tasksPage(){const p=S.filter,ts=sorted(S.tasks.filter(t=>p==='all'||(p==='active'?!t.completed_at:p==='done'?!!t.completed_at:t.category===p)));return `<div class="eyebrow">WORKSPACE</div><div class="top"><div><h1>My Tasks</h1><div class="muted">Keep everything in one place.</div></div><button class="btn" onclick="openTask()">+ New task</button></div><div class="filterbar">${['all','active','done',...CATS].map(x=>`<button onclick="setFilter('${x}')" class="${p===x?'active':''}">${x==='done'?'Completed':x==='all'?'All':x==='active'?'Active':esc(x)}</button>`).join('')}</div><section class="section">${ts.length?ts.map(t=>`<div class="item"><input type="checkbox" ${t.completed_at?'checked':''} onchange="completeTask('${t.id}')"><div class="itemmain"><b>${esc(t.title)}</b><span>${esc(t.category)} · ${human(t.duration_minutes)} · ${fmtDay(t.due_date)}</span></div><span class="tag ${esc(t.priority)}">${esc(t.priority)}</span><button class="tiny" onclick="openTask('${t.id}')">Edit</button><button class="tiny" style="color:#e11d48" onclick="removeTask('${t.id}')">Delete</button></div>`).join(''):empty('No matching tasks','Try another filter or add a new task.')}</section>`}
function calendarPage(){let d=S.month,y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<first;i++)cells.push(`<div></div>`);for(let day=1;day<=count;day++){let key=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,arr=S.tasks.filter(t=>t.due_date===key);cells.push(`<div class="daycell ${key===localDay()?'today':''}"><div class="num">${day}</div>${arr.slice(0,3).map(t=>`<div class="chip" title="${esc(t.title)}" onclick="openTask('${t.id}')" style="cursor:pointer;${t.completed_at?'opacity:.45':''}">${esc(t.title)}</div>`).join('')}${arr.length>3?`<div class="muted">+${arr.length-3} more</div>`:''}</div>`)}return `<div class="eyebrow">YOUR SCHEDULE</div><div class="top"><div><h1>Calendar</h1><div class="muted">Your tasks and deadlines, in one view.</div></div><button class="btn" onclick="openTask()">+ Add task</button></div><section class="section"><div class="headrow"><h2>${d.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><div><button class="btn ghost" onclick="changeMonth(-1)">←</button> <button class="btn ghost" onclick="changeMonth(1)">→</button></div></div><div class="scroll"><div class="calgrid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div style="text-align:center;color:#94a3b8;padding:9px">${x}</div>`).join('')}${cells.join('')}</div></div></section>`}
function settingsPage(){return `<div class="eyebrow">ACCOUNT</div><h1>Settings</h1><p class="muted">Personalize your experience.</p><div class="contentgrid"><div class="stack"><section class="section"><h2>Profile</h2><form onsubmit="saveSettings(event)"><label class="field">Display name<input id="displayname" maxlength="80" value="${esc(S.profile.display_name)}" placeholder="Your name"></label><p class="help">Timezone: ${esc(S.profile.time_zone)}</p><button class="btn" type="submit">Save profile & availability</button><h2 style="margin-top:25px">Daily availability</h2>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>`<label class="settingrow"><span>${d}</span><span><input id="hours${i}" type="number" min="0" max="24" step="0.25" value="${S.week[i]/60}" style="padding:8px;border:1px solid #e2e8f0;border-radius:8px"> hours</span></label>`).join('')}</form></section></div><div class="stack"><section class="section"><h2>Account & Data</h2><div class="muted">${uid()?`Signed in as ${esc(S.user.email)}`:'Guest mode — tasks are stored only in this browser.'}</div><p class="help">${uid()?'Your tasks are stored in Supabase, with account-based data access.':'Sign in to use cloud sync. Guest tasks are stored separately and will not automatically merge into an account.'}</p><button class="btn secondary" onclick="exportTasks()">Export JSON backup</button> <button class="btn ghost" onclick="document.getElementById('importFile').click()">Import JSON</button><input hidden type="file" id="importFile" accept="application/json" onchange="importJson(event)"><hr style="border:0;border-top:1px solid #e2e8f0;margin:19px 0"><button class="btn ghost" onclick="importLegacy()" ${!uid()?'disabled':''}>Import old FocusFlow cloud tasks</button><p class="help">Imports compatible tasks from your previous focusflow_user_data record without removing the old data.</p><button class="btn danger" onclick="signOut()">${uid()?'Sign out':'Go to sign in'}</button></section><section class="section"><h2>Reminder behavior</h2><p class="help">The open browser tab checks for due reminders. Phone notifications after the app closes require a deployed push service, not just this HTML file.</p><button class="btn secondary" onclick="askNotifications()">Enable browser notifications</button></section></div></div>`}
function render(){if(S.mode==='loading'){el('root').innerHTML='<div class="authwrap"><div class="section">Loading FocusFlow…</div></div>';return}if(S.mode==='auth'){el('root').innerHTML=`<div class="authwrap"><section class="section authcard"><div class="brand" style="padding:0"><span class="mark">✓</span> FocusFlow</div><h1>Welcome back</h1><p class="muted">Sign in to your daily planner.</p>${S.authMessage?`<div class="notice ${S.error?'err':''}">${esc(S.authMessage)}</div>`:''}<form onsubmit="authSubmit(event)"><label class="field">Email<input id="authEmail" type="email" required autocomplete="email"></label><label class="field">Password<input id="authPass" type="password" required minlength="6" autocomplete="current-password"></label><button class="btn" type="submit">Sign in</button></form><div class="authlinks"><button onclick="signup()">Create account</button><button onclick="resetPassword()">Reset password</button></div><button class="btn ghost" style="width:100%;margin-top:20px" onclick="enterGuest()">Continue on this device</button></section></div>`;return}let label=uid()?S.user.email:'Local mode';el('root').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><span class="mark">✓</span> FocusFlow</div><div class="slabel">WORKSPACE</div><div class="nav">${[['day','☀','My Day'],['tasks','☑','My Tasks'],['calendar','▦','Calendar'],['settings','⚙','Settings']].map(([p,ico,name])=>`<button onclick="nav('${p}')" class="${S.page===p?'active':''}"><span>${ico}</span>${name}</button>`).join('')}</div><div class="sidefoot">${esc(label)}</div></aside><main class="main">${S.page==='day'?dayPage():S.page==='tasks'?tasksPage():S.page==='calendar'?calendarPage():settingsPage()}</main></div>`}
function setFilter(s){S.filter=s;render()}function changeMonth(n){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+n,1);render()}
function submitQuick(e){
  e.preventDefault();
  const input=el('quick');
  const value=input?.value.trim()||'';
  // A button click must always do something, even with no task entered.
  if(!value){openTask();return;}
  openTask(null,quickParse(value));
}
function closeModal(){el('modal').classList.remove('open');el('modal').innerHTML=''}
function openTask(id=null,starter=null){let t=S.tasks.find(x=>x.id===id)||{...draftBase(),...(starter||{})};let dateTime=t.reminder_at?new Date(new Date(t.reminder_at).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';el('modal').innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="taskTitle"><div class="headrow"><h2 id="taskTitle">${id?'Edit task':'New task'}</h2><button class="btn ghost" onclick="closeModal()">✕</button></div><form id="taskForm" onsubmit="submitTask(event,${id?`'${id}'`:'null'})"><div class="formgrid"><label class="field wide">Task name<input id="t_title" required maxlength="240" value="${esc(t.title)}" autofocus></label><label class="field">Category<select id="t_cat">${CATS.map(x=>`<option ${t.category===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Priority<select id="t_priority">${['low','medium','high'].map(x=>`<option value="${x}" ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Due date<input id="t_due" type="date" value="${esc(t.due_date||'')}"></label><label class="field">Duration (minutes)<input id="t_mins" type="number" min="5" max="1440" required value="${t.duration_minutes}"></label><label class="field">Repeat<select id="t_repeat">${['none','daily','weekly','monthly'].map(x=>`<option value="${x}" ${t.recurrence===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Reminder time<input id="t_remind" type="datetime-local" value="${dateTime}"></label><label class="field wide">Notes<textarea id="t_notes">${esc(t.notes||'')}</textarea></label></div><div class="dialogactions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">${id?'Save changes':'Create task'}</button></div></form></div>`;el('modal').classList.add('open');el('t_title').focus()}
function submitTask(e,id){e.preventDefault();let remind=el('t_remind').value;let d={title:el('t_title').value.trim(),category:el('t_cat').value,priority:el('t_priority').value,due_date:el('t_due').value||null,duration_minutes:+el('t_mins').value,recurrence:el('t_repeat').value,reminder_at:remind?new Date(remind).toISOString():null,notes:el('t_notes').value};void saveTask(d,id)}
async function saveSettings(e){e.preventDefault();const name=el('displayname').value.trim(),week=Array.from({length:7},(_,i)=>Math.round(Math.min(24,Math.max(0,+el('hours'+i).value||0))*60)),profile={id:uid(),display_name:name,time_zone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'};try{if(uid()){let r=await sb.from('ff5_profiles').upsert(profile,{onConflict:'id'});if(r.error)throw r.error;r=await sb.from('ff5_availability').upsert(week.map((minutes,weekday)=>({user_id:uid(),weekday,minutes})),{onConflict:'user_id,weekday'});if(r.error)throw r.error}S.profile=profile;S.week=week;localSave();toast('Settings saved');render()}catch(e){toast(e.message,true)}}
function exportTasks(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'FocusFlow5',tasks:S.tasks},null,2)],{type:'application/json'}));a.download='focusflow-backup-'+localDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importJson(e){let file=e.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text()),arr=Array.isArray(obj)?obj:obj.tasks;if(!Array.isArray(arr))throw Error('Backup has no tasks');if(!confirm(`Import ${arr.length} tasks? Existing tasks are not removed.`))return;let count=0;for(let t of arr){if(!t.title?.trim())continue;const draft={...draftBase(),title:t.title,notes:t.notes||'',category:CATS.includes(t.category)?t.category:'Personal',priority:['low','medium','high'].includes(t.priority)?t.priority:'medium',due_date:t.due_date||t.due||null,duration_minutes:t.duration_minutes||t.duration||30,reminder_at:t.reminder_at||null,recurrence:['daily','weekly','monthly'].includes(t.recurrence)?t.recurrence:'none'};await saveTask(draft);count++}toast(`Imported ${count} tasks`)}catch(err){toast(err.message,true)}}
async function importLegacy(){if(!uid())return;try{const {data,error}=await sb.from('focusflow_user_data').select('data').eq('user_id',uid()).maybeSingle();if(error)throw error;const arr=data?.data?.tasks||[];if(!arr.length){toast('No legacy cloud tasks found');return}if(!confirm(`Import up to ${arr.length} old tasks? Existing tasks will not be removed.`))return;let n=0;for(let i=0;i<arr.length;i++){let t=arr[i];if(!t?.title?.trim())continue;let legacy_id=String(t.id??`legacy-${i}`),rec=String(t.recurrence||t.repeat||'none').toLowerCase();let draft={...draftBase(),title:t.title,notes:t.notes||'',category:CATS.includes(t.category)?t.category:'Personal',priority:['low','medium','high'].includes(String(t.priority).toLowerCase())?t.priority.toLowerCase():'medium',due_date:/^\d{4}-\d{2}-\d{2}/.test(t.due||t.deadline||t.dueDate||'')?(t.due||t.deadline||t.dueDate).slice(0,10):null,duration_minutes:Number(t.duration||t.minutes||t.estimatedMinutes||30),recurrence:['daily','weekly','monthly'].find(x=>rec.includes(x))||'none',reminder_at:t.remindAt||t.reminder_at||null};const {error:e}=await sb.from('ff5_tasks').upsert({...draft,user_id:uid(),legacy_id,completed_at:t.done?new Date().toISOString():null},{onConflict:'user_id,legacy_id',ignoreDuplicates:true});if(e)throw e;n++}await loadData();toast(`Imported / skipped existing: ${n} legacy tasks processed`)}catch(e){toast('Import failed: '+e.message,true)}}
async function authSubmit(e){e.preventDefault();if(!sb){toast('Supabase library unavailable. Use local mode.',true);return}let email=el('authEmail').value.trim(),password=el('authPass').value;let {error}=await sb.auth.signInWithPassword({email,password});if(error){S.authMessage=error.message;S.error=error.message;render()}else{S.authMessage='';S.error=''}}
async function signup(){if(!sb){toast('Supabase library unavailable',true);return}let email=el('authEmail')?.value?.trim(),password=el('authPass')?.value;if(!email||!password){toast('Enter email and password first',true);return}let {error}=await sb.auth.signUp({email,password});S.authMessage=error?.message||'Account created. Check your inbox if email confirmation is enabled.';S.error=error?.message||'';render()}
async function resetPassword(){if(!sb)return;let email=el('authEmail')?.value?.trim();if(!email){toast('Enter your email first');return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});toast(error?error.message:'Password reset email requested',!!error)}
async function signOut(){if(uid()&&sb)await sb.auth.signOut();S.user=null;S.mode='auth';S.tasks=[];S.profile={display_name:'',time_zone:'UTC'};render()}
function enterGuest(){S.user=null;S.mode='app';S.page='day';void loadData()}
async function askNotifications(){if(!('Notification'in window)){toast('This browser does not support notifications',true);return}let p=await Notification.requestPermission();toast(p==='granted'?'Notifications enabled while app is running':'Notification permission: '+p)}
const fired=new Set();function checkReminders(){if(S.mode!=='app')return;for(const t of pending()){if(!t.reminder_at)continue;let when=new Date(t.reminder_at).getTime(),key=t.id+'|'+t.reminder_at,now=Date.now();if(Number.isFinite(when)&&now>=when&&now-when<60000&&!fired.has(key)){fired.add(key);toast('Reminder: '+t.title);if('Notification'in window&&Notification.permission==='granted')new Notification('FocusFlow reminder',{body:t.title,tag:t.id})}}}
async function init(){S.mode='loading';render();if(sb){try{const {data}=await sb.auth.getSession();if(data.session?.user){S.user=data.session.user;S.mode='app';await loadData()}else{S.mode='auth';render()}sb.auth.onAuthStateChange((_event,session)=>{const old=uid(),next=session?.user?.id||null;if(old!==next){S.user=session?.user||null;S.mode=next?'app':'auth';S.tasks=[];render();if(next)setTimeout(()=>loadData(),0)}})}catch(e){S.mode='auth';S.authMessage='Cloud connection unavailable. You can still use local mode.';render()}}else{S.mode='auth';S.authMessage='Cloud library could not load. Local mode is available.';render()}setInterval(()=>{if(S.mode==='app'){if(S.page==='day')render();checkReminders()}},30000)}
el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeModal()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});init();
</script></body></html>
