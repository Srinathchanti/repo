:root{--fire:#ff6b2b;--ice:#00c6e9;--ink:#131d2d;--muted:#697586;--bg:#f7f9fc;--line:#e9edf3;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.loading{min-height:100vh;display:grid;place-items:center}.brand{font-size:25px;font-weight:800;letter-spacing:-1.5px}.brand b{color:var(--ice)}.brand .flame{color:var(--fire)}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:white}.auth-left{background:#121e32;color:white;padding:55px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.auth-left:after{content:'';position:absolute;width:440px;height:440px;border:100px solid #1b3147;border-radius:50%;right:-220px;bottom:-140px}.auth-left .hero{z-index:1}.eyebrow{color:var(--fire);font-size:12px;font-weight:800;letter-spacing:2.3px;text-transform:uppercase}.auth-left h1{font-size:clamp(42px,5vw,75px);letter-spacing:-3px;line-height:1.05;margin:15px 0}.auth-left h1 span{color:var(--ice)}.auth-left p{max-width:400px;color:#b7c4d4;font-size:18px;line-height:1.5}.auth-right{display:grid;place-items:center;padding:25px}.auth-card{width:min(440px,100%)}.auth-card h2{font-size:35px;letter-spacing:-1px;margin-bottom:4px}.muted{color:var(--muted)}.auth-card .muted{margin-top:0;margin-bottom:27px}.field{display:grid;gap:7px;font-weight:700;font-size:14px;margin:13px 0}.field input,.field select,.search input,.filter{border:1px solid #dce3ed;background:#fff;border-radius:12px;padding:13px 14px;width:100%;outline:none;color:var(--ink)}.field input:focus,.field select:focus,.search input:focus{border-color:var(--fire);box-shadow:0 0 0 3px #ff6b2b22}.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;background:linear-gradient(105deg,var(--fire),#ff8a48);color:white;font-weight:800;padding:13px grid-template-columns:1.4fr 1fr;gap:20px;margin-top:20px}.panel{padding:29px}.panel h2{font-size:29px;letter-spacing:-1px}.panel p{color:var(--muted);line-height:1.5}.summary{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:15px 0}.toolbar{display:flex;gap:12px;padding:21px;border-bottom:1px solid var(--line)}.search{flex:1}.search input{width:100%}.filter{max-width:180px}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left}th{color:#94a0ae;font-size:11px;letter-spacing:1px;background:#fbfcfe}td,th{padding:19px 23px;border-bottom:1px solid var(--line);white-space:nowrap}tbody tr{cursor:pointer}tbody tr:hover{background:#fcf8f4}.person{display:flex;align-items:center;gap:11px}.avatar{width:39px;height:39px;flex:0 0 auto;display:grid;place-items:center;border-radius:12px;color:#ed662e;background:#fff0e9;font-weight:800}.person span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.status{display:inline-flex;align-items:center;border-radius:100px;font-size:12px;font-weight:800;padding:6px 10px;background:#eaf9ef;color:#268b4a;text-transform:capitalize}.status.inactive{background:#f0f2f6;color:#6a7383}.empty{text-align:center;padding:56px 20px;color:var(--muted)}.footer{padding:14px 21px;font-size:12px;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.kv{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}.kv span{color:var(--muted)}.rate-big{font-size:36px;font-weight:800;color:var(--fire)}.rate-entry{border-bottom:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:10px}.rate-entry small{display:block;color:var(--muted)}.modal-layer{position:fixed;inset:0;z-index:100;background:#111c2caa;display:grid;place-items:center;padding:16px}.modal{width:min(550px,100%);max-height:95vh;overflow:auto;background:white;padding:26px;border-radius:23px;box-shadow:0 25px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.small{font-size:12px}.warning{font-size:13px;color:#ae6227;background:#fff5e9;padding:10px;border-radius:10px}@media(max-width:1000px){.shell{grid-template-columns:195px 1fr}.sidebar{padding:25px 12px}.content{padding:30px 22px}.topbar{padding:0 22px}.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}}@media(max-width:700px){.auth{grid-template-columns:1fr}.auth-left{min-height:230px;padding:26px}.auth-left h1{font-size:38px}.auth-left p{font-size:14px}.auth-right{padding:36px 20px}.shell{display:block}.sidebar{gap:10px;padding:16px;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}.sidebar small{display:none}.sidebar .brand{font-size:21px}.sidebar nav{display:flex}.sidebar nav .nav{width:auto}.sidebar-bottom{margin:0;padding:0;border:none}.sidebar-bottom .profile-name,.sidebar-bottom .muted{display:none}.topbar{height:50px;padding:0 16px}.content{padding:25px 16px}.page-head{align-items:start}.page-head h1{font-size:35px}.statgrid,.detail-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.toolbar{flex-direction:column}.filter{max-width:none}td,th{padding:15px 13px}}

</style>

<body><div id="app"><div class="loading">Loading Fire & Ice…</div></div><script>

  supabaseUrl: 'https://ttwwzlljaxiflpjvdpez.supabase.co',

<script>
'use strict';
const app=document.getElementById('app');
const cfg=window.FIREICE_CONFIG||{};
const configured=Boolean(cfg.supabaseUrl?.startsWith('https://')&&cfg.supabasePublishableKey&&!cfg.supabasePublishableKey.startsWith('YOUR_'));
const db=configured&&window.supabase?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
let session=null,profile=null,employees=[],rates=[],page='dashboard',selectedId=null,query='',statusFilter='all',busy=false,notice='',authMode='login';
const escapeHTML=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));
const dateToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const admin=()=>profile?.role==='admin';
function currentRate(id){return rates.filter(r=>r.employee_id===id&&r.effective_date<=dateToday()).sort((a,b)=>b.effective_date.localeCompare(a.effective_date))[0]}
function brand(){return '<div class="brand"><span class="flame">🔥</span> FIRE & <b>ICE</b></div>'}
function notification(){return notice?`<div class="notice" role="alert">${escapeHTML(notice)} <button class="link" data-action="clear-notice">Dismiss</button></div>`:''}
function setNotice(text){notice=String(text||'');render()}
function authView(){const title={login:'Welcome back',register:'Create your account',reset:'Reset password'}[authMode];app.innerHTML=`<div class="auth"><section class="auth-left">${brand()}<div class="hero"><div class="eyebrow">THE TEAM BEHIND THE EXPERIENCE</div><h1>Where great<br>teams <span>thrive.</span></h1><p>A smarter home for your people, their progress, and the details that matter.</p></div><small>BUILT FOR YOUR TEAM · V2.0</small></section><section class="auth-right"><div class="auth-card"><div class="eyebrow">FIRE & ICE STAFF PORTAL</div><h2>${title}</h2><p class="muted">${authMode==='login'?'Sign in to your workspace.':authMode==='register'?'Register your team account.':'Request a password reset email.'}</p>${!db?'<div class="notice">Supabase is not configured. Set your project URL and public key in the FIREICE_CONFIG section of this HTML file.</div>':''}${notification()}<form id="auth-form">${authMode==='register'?'<label class="field">Full name<input name="full_name" maxlength="150" required autocomplete="name"></label>':''}<label class="field">Email address<input name="email" type="email" required autocomplete="email"></label>${authMode==='reset'?'':'<label class="field">Password<input name="password" type="password" minlength="6" required autocomplete="current-password"></label>'}<button class="primary full" type="submit" ${busy||!db?'disabled':''}>${busy?'Working…':authMode==='login'?'Sign in':authMode==='register'?'Create account':'Send reset link'} →</button></form><div class="auth-links">${authMode==='login'?'<button class="link" data-mode="register">Create an account</button><button class="link" data-mode="reset">Forgot password?</button>':'<button class="link" data-mode="login">← Back to sign in</button>'}</div></div></section></div>`}
function sidebar(){return `<aside class="sidebar">${brand()}<small>WORKSPACE</small><nav><button class="nav ${page==='dashboard'?'active':''}" data-page="dashboard">◫ &nbsp; Dashboard</button><button class="nav ${page==='employees'?'active':''}" data-page="employees">♙ &nbsp; Employees</button></nav><div class="sidebar-bottom"><div class="profile-name">${escapeHTML(profile?.full_name||session.user.email)}</div><p class="muted small">${admin()?'Administrator':'Employee'}</p><button class="nav" data-action="signout">↪ Sign out</button></div></aside>`}
function currentEmployee(){return employees.find(e=>e.auth_user_id===session?.user?.id)}
function dashboard(){const active=employees.filter(e=>e.status==='active').length;const own=currentEmployee();const applicable=admin()?employees.filter(e=>e.status==='active'):own?[own]:[];const nums=applicable.map(e=>currentRate(e.id)?.hourly_rate).filter(x=>x!==undefined);const average=nums.length?nums.reduce((a,b)=>a+Number(b),0)/nums.length:0;return `<div class="page-head"><div><div class="eyebrow">WELCOME TO FIRE & ICE</div><h1>${admin()?'Business':'My'} <em>Pulse.</em></h1><p class="muted">${admin()?'Your team, your numbers, all in one place.':'Your employee profile and current pay rate.'}</p></div>${admin()?'<button class="primary" data-action="add">+ Add employee</button>':''}</div><section class="statgrid"><div class="card stat"><div class="symbol">👥</div><p>${admin()?'Total employees':'My profile'}</p><strong>${admin()?employees.length:own?'Linked':'Not linked'}</strong><small>${admin()?'People on your roster':'Contact your manager to link your login'}</small></div><div class="card stat"><div class="symbol ice">✓</div><p>${admin()?'Active employees':'Employment status'}</p><strong>${admin()?active:escapeHTML(own?.status||'Unknown')}</strong><small>${admin()?'Currently on staff':'Your record status'}</small></div><div class="card stat"><div class="symbol">💵</div><p>${admin()?'Average active hourly rate':'My hourly rate'}</p><strong>${nums.length?money(average):'Not set'}</strong><small>Current effective rate</small></div></section><section class="twocol"><div class="card panel"><div class="eyebrow">TEAM OPERATIONS</div><h2>Keep your crew in sync.</h2><p>Manage employee information, employment status, and effective-dated hourly rates with clarity.</p><button class="primary" data-page="employees">${admin()?'Open employee directory':'View my profile'} →</button></div><div class="card panel"><h2>Team snapshot</h2>${admin()?`<div class="summary"><span>Active employees</span><b>${active}</b></div><div class="summary"><span>Inactive employees</span><b>${employees.length-active}</b></div><div class="summary"><span>Profiles without linked login</span><b>${employees.filter(e=>!e.auth_user_id).length}</b></div>`:`<div class="summary"><span>Account</span><b>${escapeHTML(session.user.email)}</b></div><div class="summary"><span>Employee ID</span><b>${escapeHTML(own?.employee_code||'Not linked')}</b></div>`}</div></section>`}
function directory(){if(selectedId){const e=employees.find(x=>x.id===selectedId);if(!e){selectedId=null;return directory()}const hist=rates.filter(r=>r.employee_id===e.id).sort((a,b)=>b.effective_date.localeCompare(a.effective_date));const r=currentRate(e.id);return `<button class="secondary" data-action="back">← Back to directory</button><div class="page-head"><div><div class="eyebrow">EMPLOYEE PROFILE</div><h1>${escapeHTML(e.full_name)}</h1><p class="muted">${escapeHTML(e.employee_code)} · ${escapeHTML(e.job_title)}</p></div>${admin()?'<button class="primary" data-action="edit">Edit employee</button>':''}</div><section class="detail-grid"><div class="card panel"><h2>Employee information</h2>${[['Email',e.email],['Job title',e.job_title],['Employment type',e.employment_type==='full_time'?'Full-time':'Part-time'],['Hire date',e.hire_date],['Status',e.status],['Login linked',e.auth_user_id?'Yes':'No']].map(([k,v])=>`<div class="kv"><span>${k}</span><b>${escapeHTML(v)}</b></div>`).join('')}</div><div class="card panel"><div class="page-head"><h2>Compensation</h2>${admin()?'<button class="secondary" data-action="rate">+ Add rate</button>':''}</div><div class="eyebrow">CURRENT HOURLY RATE</div><div class="rate-big">${r?money(r.hourly_rate)+'/hr':'Not set'}</div><p class="muted">${r?`Effective ${escapeHTML(r.effective_date)}`:'No rate effective today'}</p><h3>Rate history</h3>${hist.length?hist.map(x=>`<div class="rate-entry"><div><b>${money(x.hourly_rate)}/hr</b><small>${escapeHTML(x.reason||'Rate entry')}</small></div><small>${escapeHTML(x.effective_date)}</small></div>`).join(''):'<p>No rate entries yet.</p>'}</div></section>`}
let filtered=employees.filter(e=>(statusFilter==='all'||e.status===statusFilter)&&[e.full_name,e.employee_code,e.email,e.job_title].join(' ').toLowerCase().includes(query.toLowerCase()));return `<div class="page-head"><div><div class="eyebrow">PEOPLE & CULTURE</div><h1>${admin()?'Our':'My'} <em>Team.</em></h1><p class="muted">${admin()?'Everyone who makes Fire & Ice happen.':'Your personnel information.'}</p></div>${admin()?'<button class="primary" data-action="add">+ Add employee</button>':''}</div><div class="card"><div class="toolbar"><div class="search"><input id="search" placeholder="Search name, ID, email, or position" value="${escapeHTML(query)}" aria-label="Search employees"></div><select class="filter" id="status-filter"><option value="all" ${statusFilter==='all'?'selected':''}>All employees</option><option value="active" ${statusFilter==='active'?'selected':''}>Active</option><option value="inactive" ${statusFilter==='inactive'?'selected':''}>Inactive</option></select><button class="secondary" data-action="refresh">↻ Refresh</button></div><div class="table-scroll"><table><thead><tr><th>EMPLOYEE</th><th>POSITION</th><th>STATUS</th><th>HOURLY RATE</th><th>DETAILS</th></tr></thead><tbody>${filtered.map(e=>`<tr data-employee-id="${escapeHTML(e.id)}"><td><div class="person"><div class="avatar">${escapeHTML(e.full_name.slice(0,1).toUpperCase())}</div><div><b>${escapeHTML(e.full_name)}</b><span>${escapeHTML(e.employee_code)} · ${escapeHTML(e.email)}</span></div></div></td><td>${escapeHTML(e.job_title)}</td><td><span class="status ${escapeHTML(e.status)}">${escapeHTML(e.status)}</span></td><td>${currentRate(e.id)?money(currentRate(e.id).hourly_rate)+'/hr':'Not set'}</td><td>→</td></tr>`).join('')}</tbody></table></div>${!filtered.length?'<div class="empty">No employees found</div>':''}<div class="footer">Showing ${filtered.length} of ${employees.length} employees</div></div>`}
function render(){if(!session){authView();return}app.innerHTML=`<div class="shell">${sidebar()}<main class="main"><header class="topbar"><span>WORKSPACE › ${page==='dashboard'?'Dashboard':'Employees'}</span><span>${admin()?'🔐 Admin access':'🔒 Staff access'}</span></header><div class="content">${notification()}${page==='dashboard'?dashboard():directory()}</div></main></div>`}
async function loadData(){if(!db||!session)return;const uid=session.user.id;const [p,e,r]=await Promise.all([db.from('profiles').select('id,full_name,role').eq('id',uid).single(),db.from('employees').select('*').order('full_name'),db.from('employee_rates').select('*').order('effective_date',{ascending:false})]);for(const x of [p,e,r])if(x.error)throw x.error;profile=p.data;employees=e.data||[];rates=r.data||[];render()}
async function reload(){try{notice='';await loadData()}catch(e){setNotice(`Cannot load data: ${e.message}. Check the schema and access policies.`)}}
async function init(){if(!db){render();return}const {data,error}=await db.auth.getSession();if(error)notice=error.message;session=data?.session||null;render();if(session)await reload();db.auth.onAuthStateChange((_evt,s)=>{const prev=session?.user?.id;session=s;if(!s){profile=null;employees=[];rates=[];selectedId=null;render()}else if(s.user.id!==prev)queueMicrotask(reload)})}
function showModal(type){if(!admin())return;const e=type==='add'?null:employees.find(x=>x.id===selectedId);if(type!=='add'&&!e)return;const form=type==='rate'?`<div class="warning">New rates are permanent history entries. Select an effective date; existing entries cannot be overwritten.</div><label class="field">Hourly rate (USD)<input type="number" name="hourly_rate" min="0" max="10000" step="0.01" required></label><label class="field">Effective date<input type="date" name="effective_date" value="${dateToday()}" required></label><label class="field">Reason<input name="reason" maxlength="250" placeholder="Starting rate, promotion, adjustment…"></label>`:`<div class="form-grid"><label class="field">Employee ID<input name="employee_code" maxlength="30" value="${escapeHTML(e?.employee_code||'')}" required></label><label class="field">Full name<input name="full_name" maxlength="150" value="${escapeHTML(e?.full_name||'')}" required></label><label class="field">Email<input name="email" type="email" value="${escapeHTML(e?.email||'')}" required></label><label class="field">Job title<input name="job_title" value="${escapeHTML(e?.job_title||'Staff Member')}" required></label><label class="field">Employment type<select name="employment_type"><option value="part_time" ${e?.employment_type!=='full_time'?'selected':''}>Part-time</option><option value="full_time" ${e?.employment_type==='full_time'?'selected':''}>Full-time</option></select></label><label class="field">Hire date<input name="hire_date" type="date" value="${escapeHTML(e?.hire_date||dateToday())}" required></label><label class="field">Status<select name="status"><option value="active" ${e?.status!=='inactive'?'selected':''}>Active</option><option value="inactive" ${e?.status==='inactive'?'selected':''}>Inactive</option></select></label></div>`;
const layer=document.createElement('div');layer.className='modal-layer';layer.id='modal-layer';layer.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${type==='rate'?'Add hourly rate':type==='edit'?'Edit employee':'Add employee'}</h2><button class="secondary" data-action="close-modal" aria-label="Close">✕</button></div><p class="muted">${type==='rate'?escapeHTML(e.full_name):'Fire & Ice employee directory'}</p><div id="modal-error" class="notice" style="display:none"></div><form id="edit-form" data-kind="${type}">${form}<div class="form-actions"><button type="button" class="secondary" data-action="close-modal">Cancel</button><button class="primary" type="submit">Save changes</button></div></form></div>`;document.body.appendChild(layer)}
async function submitAuth(form){if(!db)return;busy=true;notice='';render();const d=new FormData(form),email=String(d.get('email')).trim().toLowerCase(),password=String(d.get('password')||'');try{if(authMode==='login'){const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error}else if(authMode==='register'){const {error}=await db.auth.signUp({email,password,options:{data:{full_name:String(d.get('full_name')).trim()}}});if(error)throw error;authMode='login';notice='Account created. Check your email for a confirmation link if required.'}else{const {error}=await db.auth.resetPasswordForEmail(email);if(error)throw error;notice='If the email is registered, a recovery message has been sent.'}}catch(e){notice=e.message}finally{busy=false;render()}}
async function submitEditor(form){const button=form.querySelector('[type="submit"]');button.disabled=true;const errEl=document.getElementById('modal-error');errEl.style.display='none';try{const fd=new FormData(form),kind=form.dataset.kind;let result;if(kind==='rate'){const rate=Number(fd.get('hourly_rate'));if(!Number.isFinite(rate)||rate<0||rate>10000)throw Error('Invalid hourly rate');result=await db.rpc('add_employee_rate',{p_employee_id:selectedId,p_hourly_rate:rate,p_effective_date:String(fd.get('effective_date')),p_reason:String(fd.get('reason')||'')})}else{const input=Object.fromEntries(['employee_code','full_name','email','job_title','employment_type','hire_date','status'].map(k=>[k,String(fd.get(k)||'').trim()]));input.email=input.email.toLowerCase();if(!input.employee_code||!input.full_name||!input.email)throw Error('Complete all required fields');result=kind==='edit'?await db.from('employees').update(input).eq('id',selectedId):await db.from('employees').insert(input)}if(result.error)throw result.error;document.getElementById('modal-layer')?.remove();await reload()}catch(e){errEl.textContent=e.message;errEl.style.display='block'}finally{button.disabled=false}}
document.addEventListener('submit',e=>{if(e.target.id==='auth-form'){e.preventDefault();const form=e.target;submitAuth(form)}else if(e.target.id==='edit-form'){e.preventDefault();submitEditor(e.target)}});
document.addEventListener('click',async e=>{const mode=e.target.closest('[data-mode]');if(mode){authMode=mode.dataset.mode;notice='';render();return}const pg=e.target.closest('[data-page]');if(pg){page=pg.dataset.page;selectedId=null;render();return}const tr=e.target.closest('[data-employee-id]');if(tr){selectedId=tr.dataset.employeeId;page='employees';render();return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='clear-notice'){notice='';render()}if(action==='signout'&&db){await db.auth.signOut()}if(action==='add')showModal('add');if(action==='edit')showModal('edit');if(action==='rate')showModal('rate');if(action==='close-modal')document.getElementById('modal-layer')?.remove();if(action==='back'){selectedId=null;render()}if(action==='refresh')reload()});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const cursor=e.target.selectionStart;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(cursor,cursor)}});
document.addEventListener('change',e=>{if(e.target.id==='status-filter'){statusFilter=e.target.value;render()}});
init();

</script>
</body>
</html>
