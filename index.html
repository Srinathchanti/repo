<script>
(()=>{'use strict';
const SUPABASE_URL='https://ckkkosysrfllnppjmldd.supabase.co';const SUPABASE_KEY='sb_publishable_lKF-G3whxk2NkZrD6KEBTQ_KaLGkt55';const KEY='focusflow-prototype-v1';const REMINDER_KEY='focusflow-reminders-fired-v1';const initial={tasks:[],availability:{},dailyHours:3,weekly:{}};
let cloudClient=null,cloudUser=null,cloudMode="starting",cloudDirty=false,cloudBusy=false,cloudTimer=null,cloudStatus="Checking Supabase…",lastSaveError="";let state=load();let fired=loadFired();let scenario={extra:0,delay:0,newMinutes:0,priority:'high'};let page='myday';let editing=null;let calendarMonth=new Date();

function dateTimeForInput(ts){if(!ts)return '';const d=new Date(ts);if(Number.isNaN(d.getTime()))return '';const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function remindEnabled(){return !!state.reminderEnabled}
function toastReminder(task){const root=document.getElementById('reminder-toast-root');const div=document.createElement('div');div.className='reminder-toast';const b=document.createElement('b');b.textContent='🔔 Task reminder';const p=document.createElement('p');p.textContent=task.title+' · Due '+fmtDate(task.due);const close=document.createElement('button');close.className='button secondary small';close.textContent='Dismiss';close.addEventListener('click',()=>div.remove());div.append(b,p,close);root.prepend(div);while(root.children.length>4)root.lastElementChild.remove()}
function checkReminders(){if(!remindEnabled())return;const now=Date.now();let changed=false;for(const task of state.tasks){if(task.done||!task.remindAt)continue;const when=new Date(task.remindAt).getTime();if(!Number.isFinite(when)||when>now||fired[task.id]===task.remindAt)continue;if(now-when>24*60*60*1000)continue;fired[task.id]=task.remindAt;changed=true;toastReminder(task);if('Notification' in window&&Notification.permission==='granted'){try{new Notification('FocusFlow: Task reminder',{body:task.title,tag:'focusflow-'+task.id})}catch(e){/* Still show in-app reminder */}}}if(changed){try{localStorage.setItem(REMINDER_KEY,JSON.stringify(fired))}catch(e){}}}
function save(){try{localStorage.setItem(cloudUser?`focusflow-cloud-cache-${cloudUser.id}`:KEY,JSON.stringify(state))}catch(e){alert('Unable to save locally. Check browser storage settings.')}if(cloudUser&&cloudMode==='cloud'){cloudDirty=true;queueCloudSave()}updateCloudBar()}

function timeGreeting(date=new Date()){
  // Use the viewer's local clock, rather than server time.
  const hour=date.getHours();
  if(hour>=5 && hour<12)return 'Good Morning';
  if(hour>=12 && hour<17)return 'Good Afternoon';
  if(hour>=17 && hour<21)return 'Good Evening';
  return 'Good Night';
}

}

function validData(d){return !!(d&&Array.isArray(d.tasks)&&d.tasks.length<=10000&&d.tasks.every(t=>t&&typeof t.title==='string'&&typeof t.due==='string'&&typeof t.id==='string')&&(!d.availability||typeof d.availability==='object'))}
function loadCloudCache(userId){try{let d=JSON.parse(localStorage.getItem(`focusflow-cloud-cache-${userId}`));return validData(d)?{...structuredClone(initial),...d,availability:d.availability||{},weekly:d.weekly||{}}:structuredClone(initial)}catch{return structuredClone(initial)}}

async function signUpUser(){let email=document.getElementById('auth-email').value.trim(),password=document.getElementById('auth-password').value,msg=document.getElementById('auth-message');if(!email||password.length<6){msg.textContent='Enter an email and a password with at least 6 characters.';return}if(!cloudClient){msg.textContent='Supabase library is unavailable.';return}msg.textContent='Creating account…';const {data,error}=await cloudClient.auth.signUp({email,password});if(error){msg.textContent=error.message;return}if(data.session&&data.user)await activateCloud(data.user);else msg.textContent='Check your email for a confirmation link, then sign in. For auth callbacks, host FocusFlow on an HTTPS URL configured in Supabase Auth.'}
async function activateCloud(user){if(!user||cloudUser?.id===user.id&&cloudMode==='cloud'){hideAuth();return}cloudMode='loading';cloudUser=user;hideAuth();setCloudStatus('Loading…');const cached=loadCloudCache(user.id);try{const {data,error}=await cloudClient.from('focusflow_user_data').select('data').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data?.data&&validData(data.data)){state={...structuredClone(initial),...data.data,availability:data.data.availability||{},weekly:data.data.weekly||{}};cloudDirty=false}else if(data?.data){throw Error('Cloud data format is not valid. No data was overwritten.')}else{state=structuredClone(initial);let old=load(),hasOld=old.tasks.length>0||Object.keys(old.availability||{}).length>0;if(hasOld&&confirm(`No cloud plan exists for ${user.email}. Import existing browser tasks and settings into this account? Choose Cancel to start with an empty account.`))state=old;cloudDirty=true}
cloudMode='cloud';saveLocalCloudOnly();render();updateCloudBar();if(cloudDirty)queueCloudSave();else setCloudStatus('Up to date');checkReminders()}catch(err){console.error(err);cloudMode='loading';state=cached;render();showAuth('Cloud connection failed: '+(err.message||err)+'. Run the SQL setup, then sign in again, or continue offline.');setCloudStatus('Setup required');cloudUser=null}}
function saveLocalCloudOnly(){if(!cloudUser)return;try{localStorage.setItem(`focusflow-cloud-cache-${cloudUser.id}`,JSON.stringify(state))}catch(e){console.warn(e)}}
async function signOut(){if(cloudMode==='cloud'&&cloudDirty){await flushCloud();if(cloudDirty){alert('Cloud sync is not complete. Please fix the sync issue before signing out to avoid losing recent changes.');return}}if(cloudClient)await cloudClient.auth.signOut();cloudUser=null;cloudMode='offline';state=load();render();showAuth();updateCloudBar()}
async function initCloud(){try{if(!window.supabase?.createClient)throw Error('Supabase library unavailable');cloudClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let {data,error}=await cloudClient.auth.getUser();if(error)console.warn(error);if(data?.user)await activateCloud(data.user);else{cloudMode='offline';showAuth();updateCloudBar()}cloudClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'&&cloudUser){cloudUser=null;cloudMode='offline';state=load();render();showAuth();updateCloudBar()}})}catch(err){console.error(err);cloudMode='offline';showAuth('Could not connect to Supabase: '+err.message+'. You can still use the offline prototype.');updateCloudBar()}}

const today=()=>dateKey(new Date());function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDate(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function plusDays(d,n){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s){return parseDate(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function fmtMin(m){let h=Math.floor(m/60),r=m%60;return h?`${h}h${r?` ${r}m`:''}`:`${r}m`}
function escapeAttr(s){return safe(s)}
function taskDuration(t){return Math.max(0,Number(t.minutes)||0)}
function remaining(){return state.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due)||({'high':0,'medium':1,'low':2}[a.priority]-{'high':0,'medium':1,'low':2}[b.priority]))}
function available(date){let day=parseDate(date).getDay();return (Object.prototype.hasOwnProperty.call(state.availability,date)?Number(state.availability[date]):Object.prototype.hasOwnProperty.call(state.weekly||{},day)?Number(state.weekly[day]):Number(state.dailyHours))*60}
function capacityThrough(due){let now=parseDate(today()),end=parseDate(due),sum=0;if(end<now)return 0;for(let d=new Date(now);d<=end;d=plusDays(d,1))sum+=available(dateKey(d));return sum}
// Important: cumulative checks avoid incorrectly treating each due-date's capacity as fresh time.
function risk(){const r=remaining();if(!r.length)return {gap:0,work:0,capacity:available(today()),impossible:[],urgent:[],overdue:[]};let cumulative=0,gap=0,worst=null;let dates=[...new Set(r.map(t=>t.due))].sort(),overdue=r.filter(t=>t.due<today());for(const date of dates){cumulative+=r.filter(t=>t.due===date).reduce((x,t)=>x+taskDuration(t),0);let cap=capacityThrough(date),shortage=Math.max(0,cumulative-cap);if(shortage>gap){gap=shortage;worst=date}}return {gap,work:r.reduce((x,t)=>x+taskDuration(t),0),capacity:capacityThrough(dates[dates.length-1]),impossible:worst?[worst]:[],urgent:r.filter(t=>t.due<=dateKey(plusDays(new Date(),3))),overdue}}
function plan(){const todo=remaining(),days={},unscheduled=[],start=parseDate(today());const end=todo.length?parseDate(todo.reduce((m,t)=>t.due>m?t.due:m,today())):plusDays(start,6);let d=new Date(start);let count=0;while(d<=end&&count<180){let k=dateKey(d);days[k]={cap:Math.max(0,available(k)),items:[]};d=plusDays(d,1);count++}let totalScheduled=0;let priority={high:0,medium:1,low:2};const ordered=[...todo].sort((a,b)=>a.due.localeCompare(b.due)||priority[a.priority]-priority[b.priority]);for(const task of ordered){let rem=taskDuration(task);for(const [day,slot] of Object.entries(days)){if(day>task.due||rem<=0)break;let n=Math.min(rem,slot.cap);if(n>0){slot.items.push({title:task.title,id:task.id,minutes:n,due:task.due});slot.cap-=n;rem-=n;totalScheduled+=n}}if(rem>0)unscheduled.push({task,minutes:rem})}return {days,unscheduled,totalScheduled}}
// Explainable, deterministic deadline intelligence. Never mutates stored tasks.
function calculateIntelligence(data=state){
 const active=data.tasks.filter(t=>!t.done).map(t=>({...t,minutes:Math.max(0,Number(t.minutes)||0)}));
 const key=today(), end=dateKey(plusDays(new Date(),89));
 const horizon=active.filter(t=>t.due<=end);
 const overdue=horizon.filter(t=>t.due<key);
 let d=parseDate(key),capacity=0,required=0,peakGap=0,peakDay=null,firstBreach=null;
 const series=[];const byDue={};for(const t of horizon)byDue[t.due]=(byDue[t.due]||0)+t.minutes;
 for(let i=0;i<90;i++){
  const k=dateKey(d);capacity+=Math.max(0,((Object.prototype.hasOwnProperty.call(data.availability,k)?Number(data.availability[k]):(Object.prototype.hasOwnProperty.call(data.weekly||{},parseDate(k).getDay())?Number(data.weekly[parseDate(k).getDay()]):Number(data.dailyHours)))||0)*60);
  required+=(byDue[k]||0);if(i===0)required+=overdue.reduce((a,t)=>a+t.minutes,0);
  const gap=Math.max(0,required-capacity);if(gap>0&&!firstBreach)firstBreach=k;
  if(gap>peakGap){peakGap=gap;peakDay=k}
  series.push({date:k,required,capacity,gap});d=plusDays(d,1)
 }
 const allWork=active.reduce((a,t)=>a+t.minutes,0),scheduledHorizon=horizon.reduce((a,t)=>a+t.minutes,0);
 const utilization=capacity?Math.round(scheduledHorizon/capacity*100):(scheduledHorizon?999:0);
 // Score is an explainable planning heuristic, not probability of meeting a deadline.
 const score=active.length?Math.max(0,Math.round(100-65*(peakGap/Math.max(scheduledHorizon,1))-Math.min(30,overdue.length*12)-Math.min(15,firstBreach?8:0))):100;
 const level=overdue.length||peakGap>0?'At risk':active.length?'On track':'No workload';
 return {active,overdue,peakGap,peakDay,firstBreach,series,score,level,allWork,horizonCount:horizon.length,excluded:active.length-horizon.length,utilization};
}
function simulatedState(){const copy={tasks:state.tasks.map(t=>({...t})),availability:{...state.availability},dailyHours:state.dailyHours};
 let add=Number(scenario.extra)||0; if(add!==0){for(let i=0;i<14;i++){let d=dateKey(plusDays(new Date(),i));let h=Object.prototype.hasOwnProperty.call(copy.availability,d)?Number(copy.availability[d]):Number(copy.dailyHours);copy.availability[d]=Math.min(24,Math.max(0,h+add));}}
 let delay=Number(scenario.delay)||0;if(delay)for(let t of copy.tasks){if(!t.done&&t.due>=today())t.due=dateKey(plusDays(parseDate(t.due),delay));}
 let mins=Number(scenario.newMinutes)||0;if(mins>0)copy.tasks.push({id:'hypothetical',title:'Unexpected new task',due:dateKey(plusDays(new Date(),3)),priority:scenario.priority,minutes:mins,done:false});
 return copy;
}
function intelligenceView(){const a=calculateIntelligence(),p=plan();let risks=a.active.filter(t=>t.due<=dateKey(plusDays(new Date(),14))).sort((x,y)=>x.due.localeCompare(y.due));let highest=a.series.filter(x=>x.gap>0).slice(0,6);return `<div class="hero-2"><div><div class="eyebrow">EXPLAINABLE WORKLOAD ANALYSIS</div><h2>Know your deadline risk before it becomes a crisis.</h2><p class="analysis-description">We compare cumulative work due against available hours on every day across the next 90 days. Estimates are not promises.</p></div><div class="reality-ring"><span>${a.score}</span><small>Reality score / 100</small></div></div><div class="stats"><div class="card"><div class="stat-top">Risk status</div><div class="stat-number">${a.level}</div><div class="stat-note">${a.overdue.length} overdue task(s)</div></div><div class="card"><div class="stat-top">Peak shortfall</div><div class="stat-number">${fmtMin(a.peakGap)}</div><div class="stat-note">${a.peakDay?'By '+fmtDate(a.peakDay):'None within 90 days'}</div></div><div class="card"><div class="stat-top">First conflict</div><div class="stat-number" style="font-size:20px">${a.firstBreach?fmtDate(a.firstBreach):'None found'}</div><div class="stat-note">Capacity vs deadlines</div></div><div class="card"><div class="stat-top">Tasks in horizon</div><div class="stat-number">${a.horizonCount}</div><div class="stat-note">${a.excluded} beyond 90 days</div></div></div><div class="content"><div>${card(heading('Deadline pressure timeline')+`<p class="muted">Each bar shows how much required work is due relative to time available by that date. Showing the next 14 days.</p>${a.series.slice(0,14).map(x=>{let width=Math.min(100,Math.round(x.required/Math.max(x.capacity,x.required,1)*100));return `<div class="pressure-row"><span>${fmtDate(x.date)}</span><div class="progress-track"><div class="progress-fill" style="width:${width}%;background:${x.gap?'#e38a59':'#5469e8'}"></div></div><strong style="color:${x.gap?'#be5d32':'#63728c'}">${x.gap?'−'+fmtMin(x.gap):'OK'}</strong></div>`}).join('')}`)}</div><div>${card(heading('What the score means')+`<div class="analysis-figure">${a.score}/100</div><p class="analysis-description">Planning health estimate based on the largest shortage before a deadline and existing overdue tasks. A high score means the current estimates fit, not that completion is guaranteed.</p><div class="alert ${a.peakGap===0&&!a.overdue.length?'good':''}">${a.firstBreach?'First detected capacity conflict: '+fmtDate(a.firstBreach)+'.':a.active.length?'No capacity conflicts detected in the next 90 days.':'Add tasks to start analyzing your week.'}</div><p class="muted">Assumptions: task estimates are accurate, time is interchangeable across days, and no extra meetings or breaks are included. Tasks beyond 90 days are excluded from this score.</p><button class="button" data-go="planner" style="width:100%">Open recovery plan →</button>`)}<div style="height:20px"></div>${card(heading('Tasks to review')+(risks.length?risks.slice(0,6).map(t=>`<div class="plan-item"><b>${safe(t.title)}</b><p>${fmtMin(taskDuration(t))} · Due ${fmtDate(t.due)} · ${safe(t.priority)}</p></div>`).join(''):'<div class="empty">No tasks due in the next two weeks.</div>'))}</div></div>`}
function scenariosView(){let base=calculateIntelligence(),future=calculateIntelligence(simulatedState());const change=future.score-base.score;return `${card(heading('What-if planning lab',`<span class="pill">Safe preview · No data changed</span>`)+`<p class="analysis-description">Try changes to your workload and available time. Your saved tasks and schedule remain untouched until you explicitly apply a change elsewhere.</p><div class="scenario-grid"><div class="field"><label for="extra-hours">Change daily capacity (next 14 days)</label><select id="extra-hours">${[-3,-2,-1,0,1,2,3,4].map(n=>`<option value="${n}" ${scenario.extra===n?'selected':''}>${n===0?'No change':n>0?'+'+n+' hours/day':n+' hours/day'}</option>`).join('')}</select></div><div class="field"><label for="deadline-shift">Move open-task deadlines</label><select id="deadline-shift">${[0,1,2,3,5,7,14].map(n=>`<option value="${n}" ${scenario.delay===n?'selected':''}>${n===0?'No change':'+'+n+' day(s)'}</option>`).join('')}</select></div><div class="field"><label for="unexpected-work">Add unexpected task</label><select id="unexpected-work">${[0,30,60,120,180,240,360].map(n=>`<option value="${n}" ${scenario.newMinutes===n?'selected':''}>${n?fmtMin(n)+' due in 3 days':'None'}</option>`).join('')}</select></div><div class="field"><label for="unexpected-priority">Unexpected task priority</label><select id="unexpected-priority">${['high','medium','low'].map(v=>`<option value="${v}" ${scenario.priority===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></div></div><div class="form-actions"><button class="button secondary" id="reset-scenario">Reset scenario</button></div>`)}<div class="stats" style="margin-top:20px"><div class="card"><div class="stat-top">Current score</div><div class="stat-number">${base.score}</div></div><div class="card"><div class="stat-top">Projected score</div><div class="stat-number">${future.score}</div><div class="stat-note">${change>0?'+':''}${change} points</div></div><div class="card"><div class="stat-top">Current shortfall</div><div class="stat-number">${fmtMin(base.peakGap)}</div></div><div class="card"><div class="stat-top">Projected shortfall</div><div class="stat-number">${fmtMin(future.peakGap)}</div></div></div>${card(heading('Interpretation')+`<div class="alert ${future.peakGap===0&&!future.overdue.length?'good':''}">${future.peakGap?`This hypothetical schedule has a maximum capacity shortage of ${fmtMin(future.peakGap)} by ${fmtDate(future.peakDay)}.`:'Under these assumptions, tasks due in the next 90 days fit into the adjusted capacity.'}</div><p class="analysis-description">This simulation does not commit changes and does not simulate task dependencies or exact clock times. Moving a deadline is only a hypothetical option unless the user can actually renegotiate it.</p>` )}`}
function recoveryUpgrade(){let a=calculateIntelligence(),p=plan(),remainingItems=p.unscheduled.filter(x=>x.task.due>=today());let urgent=p.unscheduled.filter(x=>x.task.due<today());let task=remainingItems[0]?.task;let proposal=task?`<div class="recommendation"><b>Option A · Add capacity</b><p>Try freeing up extra time before ${fmtDate(task.due)} to cover ${fmtMin(remainingItems[0].minutes)} of <strong>${safe(task.title)}</strong>.</p><button class="button secondary small" data-go="scenarios">Test available hours →</button></div><div class="recommendation"><b>Option B · Renegotiate deadline</b><p>If your deadline is flexible, move <strong>${safe(task.title)}</strong> by 3 days and recalculate. This changes a task only after you confirm.</p><button class="button secondary small" data-delay-task="${escapeAttr(task.id)}">Move deadline +3 days</button></div>`:'<div class="alert good">No unscheduled work with future deadlines found. You can still test unexpected tasks in the What-if Lab.</div>';return card(heading('Smart recovery recommendations')+`<p class="analysis-description">Suggestions are generated from your current tasks and availability. You decide which changes are realistic.</p>${urgent.length?`<div class="alert">${urgent.length} overdue task(s) require a new deadline or manual review.</div>`:''}${proposal}<div class="recommendation"><b>Option C · Reprioritize work</b><p>Review lower-priority tasks and move work that is truly flexible; high-priority deadlines are not automatically extended.</p><button class="button secondary small" data-go="tasks">Review tasks →</button></div><p class="muted">Changes can improve capacity calculations but are not a guarantee of on-time completion.</p>`)}
function card(inner,extra=''){return `<section class="card" ${extra}>${inner}</section>`}
function heading(t,right=''){return `<div class="section-title"><h2>${t}</h2>${right}</div>`}
function rowTask(t){return `<div class="task-row"><input class="check" type="checkbox" data-toggle="${safe(t.id)}" ${t.done?'checked':''} aria-label="Mark ${escapeAttr(t.title)} complete"><div class="task-body"><div class="task-name ${t.done?'done':''}">${safe(t.title)}</div><div class="task-detail">Due ${fmtDate(t.due)} · ${fmtMin(taskDuration(t))}${!t.done&&t.due<today()?' · Overdue':''}</div></div><span class="tag ${safe(t.priority)}">${safe(t.priority)}</span><button class="text-btn" data-edit="${safe(t.id)}">Edit</button></div>`}
function overview(){const open=remaining(),done=state.tasks.filter(t=>t.done).length,all=state.tasks.length;let r=risk();return `<div class="stats">${[
['Active tasks',open.length,'Still on your list','☑'],['Completed',done,all?`${Math.round(done/all*100)}% of all tasks`:'Start with your first task','✓'],['Work remaining',fmtMin(r.work),'Estimated effort','◷'],['Workload gap',fmtMin(r.gap),r.overdue.length?`${r.overdue.length} overdue task(s)`:'Upcoming deadline risk','⚠']].map(([t,v,n,ic])=>`<div class="card stat"><div class="stat-top"><span>${t}</span><span class="stat-icon">${ic}</span></div><div class="stat-number">${v}</div><div class="stat-note">${n}</div></div>`).join('')}</div>`}
function dashboard(){let r=risk(),todo=remaining(),p=plan(),cap=Math.max(r.capacity,0),ratio=cap?Math.round(r.work/cap*100):(r.work?100:0);return overview()+`<div class="feature-strip"><div><b>FocusFlow Intelligence 2.0</b><p>Understand deadline pressure, recovery options, and how changes affect your plan.</p></div><div class="toolbar"><button class="button secondary small" data-go="intelligence">Risk intelligence →</button><button class="button small" data-go="scenarios">What-if lab →</button></div></div><div class="content"><div>${card(heading('Upcoming deadlines',`<button class="text-btn" data-go="tasks">View all →</button>`)+(todo.length?todo.slice(0,6).map(rowTask).join(''):`<div class="empty">No tasks yet. Add your first task to check if your work fits your time.</div>`))}</div><div>${card(heading('Workload reality check',`<span class="pill ${r.gap>0||r.overdue.length?'warning':''}">${r.gap>0||r.overdue.length?'Needs attention':'On track'}</span>`)+`<div class="analysis-description">Work due through your latest deadline compared with available time</div><div class="mini-stats"><div><span>Work required</span><b>${fmtMin(r.work)}</b></div><div><span>Time available</span><b>${fmtMin(r.capacity)}</b></div></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,ratio)}%;background:${r.gap||r.overdue.length?'#e09154':'#5167e7'}"></div></div><div class="meter-info"><span>Estimated utilization</span><span>${ratio}%</span></div><div style="height:16px"></div><div class="alert ${r.gap===0&&!r.overdue.length?'good':''}">${!todo.length?'Add a task to see deadline pressure.':r.overdue.length?`${r.overdue.length} task(s) already overdue. Review dates and create a recovery plan.`:r.gap?`⚠ Your deadlines have a ${fmtMin(r.gap)} capacity shortfall. A recovery plan can show what will not fit.`:'✓ Estimated work fits your available time through the last deadline.'}</div><div style="height:14px"></div><button class="button secondary" data-go="planner" style="width:100%">View recovery plan →</button>`)}<div style="height:20px"></div>${card(heading('Today at a glance')+`<div class="analysis-description">You have ${fmtMin(available(today()))} available today. ${p.days[today()]?`The suggested plan allocates ${fmtMin(p.days[today()].items.reduce((s,x)=>s+x.minutes,0))}.`:'Add tasks to start planning.'}</div><div style="height:12px"></div>${(p.days[today()]?.items||[]).slice(0,3).map(x=>`<div class="plan-item"><b>${safe(x.title)}</b><p>${fmtMin(x.minutes)} recommended today</p></div>`).join('')||'<div class="empty">Nothing scheduled yet.</div>'}`)}</div></div>`}
function tasksView(){const tasks=[...state.tasks].sort((a,b)=>Number(a.done)-Number(b.done)||a.due.localeCompare(b.due));return card(heading('All tasks',`<span class="muted">${tasks.length} total</span>`)+`<div class="toolbar"><span class="muted">Click a task’s checkbox to mark it complete, or Edit to change details.</span></div>`+(tasks.length?tasks.map(t=>rowTask(t)+`<div style="text-align:right"><button class="text-btn" data-delete="${safe(t.id)}">Delete</button></div>`).join(''):'<div class="empty">You have no tasks. Create one with a title, deadline, priority, and time estimate.</div>'))}
function calendarView(){let first=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1),offset=first.getDay(),end=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();let cells=Array.from({length:offset},()=>'<div class="day blank"></div>');for(let i=1;i<=end;i++){let date=dateKey(new Date(first.getFullYear(),first.getMonth(),i));let ts=state.tasks.filter(t=>t.due===date);cells.push(`<div class="day"><header>${i}</header>${ts.slice(0,3).map(t=>`<div title="${escapeAttr(t.title)}" class="dot ${date<today()&&!t.done?'overdue':''}">${t.done?'✓ ':''}${safe(t.title)}</div>`).join('')}${ts.length>3?`<span class="muted">+${ts.length-3} more</span>`:''}</div>`)}return card(heading('Deadline calendar',`<span class="muted">${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span>`)+`<div class="toolbar"><button class="button secondary small" data-month="-1">← Previous</button><button class="button secondary small" data-month="0">Today</button><button class="button secondary small" data-month="1">Next →</button></div><div class="weekdays">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(s=>`<span>${s}</span>`).join('')}</div><div class="calendar-grid">${cells.join('')}</div><p class="muted">Tasks appear on their due dates. Set daily availability in Settings.</p>`)}
function plannerView(){let p=plan(),r=risk();let shown=Object.entries(p.days).filter(([date,x])=>x.items.length||date<=dateKey(plusDays(new Date(),6))).slice(0,14);return `<div style="margin-bottom:20px">${recoveryUpgrade()}</div><div class="content"><div>${card(heading('Suggested work sessions',`<span class="pill ${p.unscheduled.length?'warning':''}">${p.unscheduled.length?'Review needed':'Estimated fit'}</span>`)+`<p class="analysis-description">Sessions are allocated in priority and deadline order, using your daily available hours. You can adjust hours in Settings.</p>${shown.length?shown.map(([date,x])=>`<div style="border-top:1px solid #eff1f5;padding:15px 0"><b style="font-size:13px">${fmtDate(date)}</b> <span class="muted">· ${fmtMin(available(date))} capacity</span>${x.items.map(t=>`<div class="plan-item"><b>${safe(t.title)}</b><p>${fmtMin(t.minutes)} · Due ${fmtDate(t.due)}</p></div>`).join('')||'<div class="empty">No assigned work.</div>'}</div>`).join(''):'<div class="empty">Add tasks to generate suggested sessions.</div>'}`)}</div><div>${card(heading('Recovery insights')+`<div class="mini-stats"><div><span>Planned time</span><b>${fmtMin(p.totalScheduled)}</b></div><div><span>Time that does not fit</span><b>${fmtMin(p.unscheduled.reduce((s,x)=>s+x.minutes,0))}</b></div></div>${p.unscheduled.length?`<div class="alert">Some work cannot fit before its deadlines. Increase availability, start earlier, reduce scope, or renegotiate deadlines.</div>${p.unscheduled.map(x=>`<div class="plan-item"><b>${safe(x.task.title)}</b><p>${fmtMin(x.minutes)} not scheduled before ${fmtDate(x.task.due)}</p></div>`).join('')}`:`<div class="alert good">${r.overdue.length?'Some overdue tasks require an updated deadline.':'All remaining work fits within your configured capacity through the selected dates.'}</div>`}<p class="muted">Planning is a transparent estimate, not a guarantee. This prototype does not account for meetings, task dependencies, or breaks automatically.</p><button class="button secondary" data-go="settings">Edit daily availability →</button>`)}<div style="height:18px"></div>${card(heading('How to recover')+`<p class="analysis-description">1. Prioritize high-impact, near-deadline work.<br>2. Break large tasks into manageable sessions.<br>3. Add realistic available hours or revise due dates.<br>4. Reopen this planner to recalculate.</p>`)}</div></div>`}
function nextRecurringDate(due,frequency){let d=parseDate(due);if(frequency==='daily')return dateKey(plusDays(d,1));if(frequency==='weekly')return dateKey(plusDays(d,7));if(frequency==='monthly'){let target=d.getDate();let first=new Date(d.getFullYear(),d.getMonth()+1,1);let last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();first.setDate(Math.min(target,last));return dateKey(first)}return null}
function recurComplete(task){if(!task.repeat||task.repeat==='none')return;let next=nextRecurringDate(task.due,task.repeat),count=0;while(next&&next<today()&&count<400){next=nextRecurringDate(next,task.repeat);count++}if(!next||state.tasks.some(t=>t.seriesId===(task.seriesId||task.id)&&t.due===next))return;state.tasks.push({...task,id:newId(),due:next,remindAt:task.remindAt?new Date(new Date(task.remindAt).getTime()+(parseDate(next).getTime()-parseDate(task.due).getTime())).toISOString():null,done:false,seriesId:task.seriesId||task.id})}
function newId(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():String(Date.now()+Math.random())}
function parseQuick(raw){let txt=raw.trim(),lower=txt.toLowerCase(),date=today(),weekday=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];let match=lower.match(/\b(today|tomorrow|next\s+(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday)|(?:mon|tues|wednes|thurs|fri|satur|sun)day|\d{4}-\d{2}-\d{2})\b/);if(match){let m=match[0];if(m==='tomorrow')date=dateKey(plusDays(new Date(),1));else if(m==='today')date=today();else if(/^\d{4}-/.test(m)){let d=parseDate(m);if(!Number.isNaN(d.getTime())&&dateKey(d)===m)date=m}else{let name=m.replace('next ','');let diff=(weekday.indexOf(name)-new Date().getDay()+7)%7;date=dateKey(plusDays(new Date(),diff||7))}txt=txt.replace(new RegExp(match[0],'i'),' ').replace(/\s+/g,' ').trim()}let effort=txt.match(/\b(\d+(?:\.\d+)?)\s*(hours?|hrs?|minutes?|mins?)\b/i),minutes=30;if(effort){minutes=Math.round(Number(effort[1])*(effort[2].toLowerCase().startsWith('h')?60:1));txt=txt.replace(effort[0],' ').replace(/\s+/g,' ').trim()}let recurring=txt.match(/\b(every day|daily|every week|weekly|every month|monthly)\b/i),repeat='none';if(recurring){repeat=/day/i.test(recurring[0])?'daily':/week/i.test(recurring[0])?'weekly':'monthly';txt=txt.replace(recurring[0],' ').replace(/\s+/g,' ').trim()}return {title:txt.replace(/\s+(at|on|by)$/i,'').trim(),due:date,minutes:Math.min(100000,Math.max(5,minutes)),repeat}}
function myDayView(){let now=today(),list=remaining().filter(t=>t.due<=now),urgent=remaining().filter(t=>t.due<=dateKey(plusDays(new Date(),2))),todayWork=list.reduce((a,t)=>a+taskDuration(t),0),capacity=available(now),p=plan(),r=calculateIntelligence();let near=remaining().filter(t=>t.due>now).slice(0,4);return `<div class="quick-hero"><div><div class="eyebrow" id="today-date-label">TODAY, ${safe(new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}))}</div><h2>Plan your day 👋</h2><p>Capture a responsibility, understand your capacity, and plan without overwhelm.</p></div><form id="quick-form" class="quick-form"><label for="quick-text">Quick add a task</label><div class="quick-inline"><input id="quick-text" maxlength="180" required placeholder="Pay electricity bill tomorrow · 15 min"><button class="button" type="submit">Add task ↗</button></div><small>Supports today, tomorrow, weekdays, ISO dates, 30 min / 2 hours, every day/week/month. Review detected details before saving.</small></form></div><div class="stats"><div class="card stat"><div class="stat-top">Due today or overdue <span class="stat-icon">☑</span></div><div class="stat-number">${list.length}</div><div class="stat-note">Open tasks including any overdue</div></div><div class="card stat"><div class="stat-top">Work due now <span class="stat-icon">◷</span></div><div class="stat-number">${fmtMin(todayWork)}</div><div class="stat-note">Estimated time required</div></div><div class="card stat"><div class="stat-top">Available today <span class="stat-icon">▦</span></div><div class="stat-number">${fmtMin(capacity)}</div><div class="stat-note">Based on your weekly schedule</div></div><div class="card stat"><div class="stat-top">Reality score <span class="stat-icon">◇</span></div><div class="stat-number">${r.score}<span style="font-size:15px;color:#8390a7">/100</span></div><div class="stat-note">Heuristic, not a probability</div></div></div><div class="content"><div>${card(heading('Your priorities',`<button class="text-btn" data-go="tasks">View all tasks →</button>`)+ (list.length?list.map(t=>`<div class="task-row"><input class="check" type="checkbox" data-toggle="${safe(t.id)}" aria-label="Complete ${escapeAttr(t.title)}"><div class="task-body"><div class="task-name">${safe(t.title)}</div><div class="task-detail">${fmtMin(taskDuration(t))} · ${safe(t.priority)} · Due ${fmtDate(t.due)} ${t.repeat&&t.repeat!=='none'?'· ↻ '+safe(t.repeat):''}</div></div><button class="text-btn" data-edit="${safe(t.id)}">Edit</button></div>`).join(''):'<div class="empty">Nothing due today. Add a task or check what is coming up next.</div>')+`<div class="alert ${todayWork<=capacity?'good':''}" style="margin-top:15px">${todayWork>capacity?`You have ${fmtMin(todayWork-capacity)} more work due than time available today. Consider adjusting your plan.`:`Your due-today work fits within today’s configured time. Future deadlines still need attention.`}</div>`)}<div style="height:18px"></div>${card(heading('Coming up next')+(near.length?near.map(t=>`<div class="task-row"><div class="task-body"><b class="task-name">${safe(t.title)}</b><div class="task-detail">${fmtDate(t.due)} · ${fmtMin(taskDuration(t))}</div></div><span class="tag ${safe(t.priority)}">${safe(t.priority)}</span></div>`).join(''):'<div class="empty">No upcoming tasks yet.</div>'))}</div><div>${card(heading('Your day at a glance')+`<div class="mini-stats"><div><span>Due-now workload</span><b>${fmtMin(todayWork)}</b></div><div><span>Today’s capacity</span><b>${fmtMin(capacity)}</b></div></div><div class="progress-track"><div class="progress-fill" style="width:${capacity?Math.min(100,100*todayWork/capacity):todayWork?100:0}%"></div></div><p class="analysis-description">Tasks are estimates. This is not an automatic timed calendar.</p><button class="button secondary small" data-go="planner">Open recovery planner →</button>`)}<div style="height:18px"></div>${card(heading('Planning snapshot')+`<p class="analysis-description">${p.unscheduled.length?`${p.unscheduled.length} task(s) have work that cannot fit before their deadlines.`:'No unscheduled work found in the current planning horizon.'}</p><button class="button secondary small" data-go="intelligence">See deadline risks →</button>`)}<div style="height:18px"></div>${card(heading('Customize your schedule')+`<p class="analysis-description">Set different hours for weekdays and weekends, plus date-specific exceptions.</p><button class="button secondary small" data-go="settings">Edit weekly availability →</button>`)}</div></div>`}
function settingsView(){let upcoming=Array.from({length:14},(_,i)=>dateKey(plusDays(new Date(),i)));return card(heading('Your profile')+`<div class="settings-row"><div><b>Display name</b><p class="muted">This name appears on your dashboard.</p></div><input id="profile-name" maxlength="60" placeholder="Your name" value="${escapeAttr(state.profileName||'')}" aria-label="Your display name"></div><div class="form-actions"><button type="button" class="button secondary" id="save-profile">Save name</button></div><hr style="border:0;border-top:1px solid #edf0f5;margin:25px 0"><h3>Account &amp; cloud synchronization</h3><p class="muted" id="cloud-status">Checking account…</p><div class="form-actions"><button class="button secondary" id="sync-now" type="button">Sync now</button><button class="button secondary" id="account-action" type="button">Account</button></div>`)+`<div style="height:20px"></div>`+card(heading('Planning preferences')+`<div class="settings-row"><div><b>Default available time</b><p class="muted">Hours you can spend each day, unless overridden below.</p></div><input id="daily-hours" type="number" min="0" max="24" step="0.5" value="${Number(state.dailyHours)}" aria-label="Default daily hours"></div><hr style="border:0;border-top:1px solid #edf0f5;margin:25px 0"><h3>Task reminders</h3><div class="reminder-banner"><strong>Phone notification limitation</strong>Local HTML can show alerts when it is open, and system notifications where the browser permits. It cannot reliably send notifications to your phone when the website is closed. For that, FocusFlow will need HTTPS hosting, a PWA, a push subscription, and a server to send push messages.</div><div class="settings-row"><div><b>Enable reminders while app is open</b><p class="muted">You choose the reminder date/time on each task.</p></div><input type="checkbox" id="enable-reminders" ${state.reminderEnabled?'checked':''} style="width:22px;height:22px"></div><div class="form-actions"><button class="button secondary small" id="test-reminder">Test reminder</button><button class="button secondary small" id="allow-notifications">Allow system notifications</button></div><hr style="border:0;border-top:1px solid #edf0f5;margin:25px 0"><h3>Weekly availability</h3><p class="muted">Optional hours for each weekday. Blank uses default availability.</p><div class="weekly-grid">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((name,i)=>`<div class="field"><label for="week-${i}">${name}</label><input id="week-${i}" data-weekly="${i}" type="number" min="0" max="24" step="0.5" placeholder="Default" value="${Object.prototype.hasOwnProperty.call(state.weekly||{},i)?state.weekly[i]:''}"></div>`).join('')}</div><h3>Daily overrides (next 14 days)</h3><p class="muted">Leave a field empty to use your default hours. Enter 0 for an unavailable day.</p>${upcoming.map(date=>`<div class="settings-row" style="padding:9px 0;border-bottom:1px solid #f2f3f7"><label for="day-${date}" style="font-size:13px">${fmtDate(date)}</label><input id="day-${date}" data-availability="${date}" type="number" step="0.5" min="0" max="24" placeholder="Default" value="${Object.prototype.hasOwnProperty.call(state.availability,date)?state.availability[date]:''}"></div>`).join('')}<div class="form-actions"><button class="button" id="save-settings">Save settings</button></div><hr style="border:0;border-top:1px solid #edf0f5;margin:25px 0"><div class="settings-row"><div><b>Export your tasks</b><p class="muted">Download your tasks and availability as a JSON backup.</p></div><button class="button secondary small" id="export">Export JSON</button></div><div class="settings-row" style="margin-top:15px"><div><b>Import an earlier backup</b><p class="muted">Restore exported FocusFlow 2.0 or 3.0 tasks and availability. Replaces the current local data.</p></div><label class="button secondary small" for="import-file" style="cursor:pointer">Import JSON</label><input id="import-file" type="file" accept=".json,application/json" class="hidden"></div><div style="height:20px"></div><div class="settings-row"><div><b>Reset prototype</b><p class="muted">Permanently remove all locally saved tasks and settings.</p></div><button class="button danger small" id="reset">Clear all data</button></div>`)}
function render(){let labels={myday:['YOUR DAY','My day','A practical plan for what matters today.'],dashboard:['YOUR WORKSPACE','Your dashboard','Turn deadlines into a realistic plan.'],tasks:['TASK MANAGER','My tasks','Track priorities, deadlines, and estimated effort.'],calendar:['DEADLINE VIEW','Your calendar','See what is due and when.'],planner:['SMART SCHEDULING','Recovery planner','See what fits, what does not, and what to adjust.'],settings:['PREFERENCES','Planning settings','Set realistic availability and manage your data.'],intelligence:['WORKLOAD INTELLIGENCE','Risk intelligence','Your deadline pressure, explained.'],scenarios:['PLANNING SANDBOX','What-if lab','Experiment safely before you change your schedule.']};const [e,t,s]=labels[page];document.getElementById('page-eyebrow').textContent=e;document.getElementById('page-title').textContent=(page==='myday'||page==='dashboard')?timeGreeting()+', '+displayName()+'!':t;document.getElementById('page-subtitle').textContent=s;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('view').innerHTML=({myday:myDayView,dashboard, tasks:tasksView,calendar:calendarView,planner:plannerView,settings:settingsView,intelligence:intelligenceView,scenarios:scenariosView})[page]();updateCloudBar();}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function modal(t){editing=t||null;let x=t||{title:'',due:today(),minutes:60,priority:'medium'};document.getElementById('modal-root').innerHTML=`<div class="modal-shell" id="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading"><h2 id="modal-heading">${t?'Edit task':'Create a task'}</h2><form id="task-form"><div class="form-grid"><div class="field full"><label for="task-title">Task title</label><input id="task-title" required maxlength="140" value="${escapeAttr(x.title)}" placeholder="e.g. Finish research paper"></div><div class="field"><label for="task-due">Deadline</label><input id="task-due" type="date" required value="${escapeAttr(x.due)}"></div><div class="field"><label for="task-minutes">Estimated minutes</label><input id="task-minutes" type="number" required min="5" max="100000" step="5" value="${taskDuration(x)}"></div><div class="field full"><label for="task-priority">Priority</label><select id="task-priority">${['high','medium','low'].map(p=>`<option value="${p}" ${p===x.priority?'selected':''}>${p.charAt(0).toUpperCase()+p.slice(1)}</option>`).join('')}</select></div><div class="field full"><label for="task-repeat">Repeat</label><select id="task-repeat">${['none','daily','weekly','monthly'].map(f=>`<option value="${f}" ${f===(x.repeat||'none')?'selected':''}>${f==='none'?'Does not repeat':f.charAt(0).toUpperCase()+f.slice(1)}</option>`).join('')}</select></div><div class="field full"><label for="task-remind">Reminder date & time (optional)</label><input id="task-remind" type="datetime-local" value="${dateTimeForInput(x.remindAt)}"><small class="muted">Alerts while FocusFlow is open. Closed-app phone push requires hosted PWA + backend.</small></div></div><div class="form-actions"><button type="button" id="cancel-modal" class="button secondary">Cancel</button><button type="submit" class="button">${t?'Save changes':'Create task'}</button></div></form></div></div>`;document.getElementById('task-title').focus()}
function closeModal(){document.getElementById('modal-root').innerHTML='';editing=null}
document.addEventListener('submit',e=>{if(e.target.id==='auth-form'){e.preventDefault();signInUser();return}if(e.target.id==='quick-form'){e.preventDefault();let q=parseQuick(document.getElementById('quick-text').value);if(!q.title)return alert('Enter a short task description.');modal();document.getElementById('task-title').value=q.title;document.getElementById('task-due').value=q.due;document.getElementById('task-minutes').value=q.minutes;document.getElementById('task-repeat').value=q.repeat;return}if(e.target.id!=='task-form')return;e.preventDefault();let title=document.getElementById('task-title').value.trim(),due=document.getElementById('task-due').value,minutes=Number(document.getElementById('task-minutes').value),priority=document.getElementById('task-priority').value,repeat=document.getElementById('task-repeat').value,remindRaw=document.getElementById('task-remind').value,remindAt=remindRaw?new Date(remindRaw).toISOString():null;if(!title||!/^\d{4}-\d{2}-\d{2}$/.test(due)||!Number.isFinite(minutes)||minutes<5||minutes>100000)return alert('Enter a task title, valid deadline and effort of at least 5 minutes.');if(editing){Object.assign(state.tasks.find(t=>t.id===editing.id) ,{title,due,minutes,priority,repeat,remindAt})}else state.tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title,due,minutes,priority,repeat,remindAt,done:false});save();closeModal();render();checkReminders()});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(b?.id==='auth-signup')return signUpUser();if(b?.id==='auth-reset'){const email=document.getElementById('auth-email')?.value?.trim();if(!email)return alert('Enter your email address first.');if(!cloudClient)return alert('Supabase is unavailable.');cloudClient.auth.resetPasswordForEmail(email).then(({error})=>alert(error?error.message:'Password reset email requested. Configure your redirect URL in Supabase Auth.'));return}if(!b){if(e.target.id==='modal-overlay')closeModal();return}if(b.id==='account-action'){if(cloudUser)return signOut();return showAuth()}if(b.id==='sync-now')return syncNow();if(b.id==='save-profile'){const v=document.getElementById('profile-name')?.value.trim()||'';if(v.length>60)return alert('Name must be 60 characters or fewer.');state.profileName=v;save();render();return;}if(b.dataset.page)return go(b.dataset.page);if(b.dataset.go)return go(b.dataset.go);if(b.id==='add-task-top')return modal();if(b.id==='reset-scenario'){scenario={extra:0,delay:0,newMinutes:0,priority:'high'};render();return}if(b.dataset.delayTask){let t=state.tasks.find(x=>x.id===b.dataset.delayTask);if(t&&confirm('Move deadline for '+t.title+' by 3 days?')){t.due=dateKey(plusDays(parseDate(t.due),3));save();render()}return}if(b.id==='cancel-modal')return closeModal();if(b.dataset.edit)return modal(state.tasks.find(x=>x.id===b.dataset.edit));if(b.dataset.delete){if(confirm('Delete this task?')){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.delete);save();render()}return}if(b.dataset.month!==undefined){let n=Number(b.dataset.month);calendarMonth=n===0?new Date():new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+n,1);render();return}if(b.id==='allow-notifications'){if(!('Notification' in window))return alert('System notifications are not supported by this browser. In-app reminders can still work.');if(!window.isSecureContext)return alert('System notifications require HTTPS or localhost. A file opened directly from disk might not support them.');Notification.requestPermission().then(p=>alert(p==='granted'?'System notifications enabled. Keep the app open to receive reminders.':'Notifications not permitted; in-app reminders remain available.'));return}if(b.id==='test-reminder'){toastReminder({title:'This is your test reminder',due:today()});if('Notification' in window&&Notification.permission==='granted'){try{new Notification('FocusFlow test reminder',{body:'Your reminder settings are working while the page is open.'})}catch(e){}}return}if(b.id==='save-settings'){state.reminderEnabled=document.getElementById('enable-reminders').checked;let weekly={};for(let f of document.querySelectorAll('[data-weekly]')){if(f.value.trim()==='')continue;let h=Number(f.value);if(!Number.isFinite(h)||h<0||h>24)return alert('Weekly hours must be between 0 and 24.');weekly[f.dataset.weekly]=h}let v=Number(document.getElementById('daily-hours').value);if(!Number.isFinite(v)||v<0||v>24)return alert('Default daily hours must be between 0 and 24.');let updates={...state.availability};for(let input of document.querySelectorAll('[data-availability]')){if(input.value.trim()==='')delete updates[input.dataset.availability];else{let h=Number(input.value);if(!Number.isFinite(h)||h<0||h>24)return alert('Override hours must be between 0 and 24.');updates[input.dataset.availability]=h}}state.dailyHours=v;state.availability=updates;state.weekly=weekly;save();render();alert('Availability saved.');return}if(b.id==='reset'){if(confirm('Delete ALL locally saved FocusFlow tasks and settings? This cannot be undone.')){state=structuredClone(initial);save();go('dashboard')}return}if(b.id==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='focusflow-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'){let f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>2000000)return alert('Backup exceeds the 2 MB limit.');try{let data=JSON.parse(await f.text());if(!data||!Array.isArray(data.tasks)||typeof data.availability!=='object'||data.availability===null||data.tasks.length>10000||data.tasks.some(t=>!t||typeof t.title!=='string'||typeof t.due!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.due)||!Number.isFinite(Number(t.minutes))||!['high','medium','low'].includes(t.priority)))throw new Error('Invalid task data');if(!confirm('Replace all current local tasks and settings with this backup?'))return;state={...structuredClone(initial),...data,availability:data.availability||{},weekly:data.weekly||{}};save();go('myday')}catch(err){alert('Could not import this FocusFlow backup: '+err.message)}return}if(['extra-hours','deadline-shift','unexpected-work','unexpected-priority'].includes(e.target.id)){scenario.extra=Number(document.getElementById('extra-hours').value);scenario.delay=Number(document.getElementById('deadline-shift').value);scenario.newMinutes=Number(document.getElementById('unexpected-work').value);scenario.priority=document.getElementById('unexpected-priority').value;render();return}if(!e.target.matches('[data-toggle]'))return;let task=state.tasks.find(t=>t.id===e.target.dataset.toggle);if(task){task.done=e.target.checked;if(task.done)recurComplete(task);save();render()}});
render();initCloud();checkReminders();setInterval(checkReminders,15000);setInterval(updateLiveGreeting,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();updateLiveGreeting()}});window.addEventListener('online',()=>{if(cloudDirty)queueCloudSave()});
})();
