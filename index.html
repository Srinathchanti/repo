function parseQuick(raw){let txt=raw.trim(),lower=txt.toLowerCase(),date=today(),weekday=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];let match=lower.match(/\b(today|tomorrow|next\s+(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday)|(?:mon|tues|wednes|thurs|fri|satur|sun)day|\d{4}-\d{2}-\d{2})\b/);if(match){let m=match[0];if(m==='tomorrow')date=dateKey(plusDays(new Date(),1));else if(m==='today')date=today();else if(/^\d{4}-/.test(m)){let d=parseDate(m);if(!Number.isNaN(d.getTime())&&dateKey(d)===m)date=m}else{let name=m.replace('next ','');let diff=(weekday.indexOf(name)-new Date().getDay()+7)%7;date=dateKey(plusDays(new Date(),diff||7))}txt=txt.replace(new RegExp(match[0],'i'),' ').replace(/\s+/g,' ').trim()}let effort=txt.match(/\b(\d+(?:\.\d+)?)\s*(hours?|hrs?|minutes?|mins?)\b/i),minutes=30;if(effort){minutes=Math.round(Number(effort[1])*(effort[2].toLowerCase().startsWith('h')?60:1));txt=txt.replace(effort[0],' ').replace(/\s+/g,' ').trim()}let recurring=txt.match(/\b(every day|daily|every week|weekly|every month|monthly)\b/i),repeat='none';if(recurring){repeat=/day/i.test(recurring[0])?'daily':/week/i.test(recurring[0])?'weekly':'monthly';txt=txt.replace(recurring[0],' ').replace(/\s+/g,' ').trim()}return {title:txt.replace(/\s+(at|on|by)$/i,'').trim(),due:date,minutes:Math.min(100000,Math.max(5,minutes)),repeat}}

 class="button secondary" data-go="settings">Edit daily availability →</button>`)}<div style="height:18px"></div>${card(heading('How to recover')+`<p class="analysis-description">1. Prioritize high-impact, near-deadline work.<br>2. Break large tasks into manageable sessions.<br>3. Add realistic available hours or revise due dates.<br>4. Reopen this planner to recalculate.</p>`)}</div></div>`}
function nextRecurringDate(due,frequency){let d=parseDate(due);if(frequency==='daily')return dateKey(plusDays(d,1));if(frequency==='weekly')return dateKey(plusDays(d,7));if(frequency==='monthly'){let target=d.getDate();let first=new Date(d.getFullYear(),d.getMonth()+1,1);let last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();first.setDate(Math.min(target,last));return dateKey(first)}return null}

// Smart Insights 2.0: deterministic, local task analysis; suggestions never mutate data automatically.
function smartInsights(){
 const now=today(), open=remaining(), capacity=Math.max(0,available(now));
 const due=open.filter(t=>t.due<=now), dueMins=due.reduce((n,t)=>n+taskDuration(t),0);
 const messages=[];
 const add=(type,title,body,button,action,id)=>messages.push({type,title,body,button,action,id});
 const overdue=open.filter(t=>t.due<now);
 if(overdue.length){const t=overdue[0];add('warning','An overdue task needs attention',`“${t.title}” was due ${fmtDate(t.due)}. Review its deadline or finish it if already done.`,'Review task','edit',t.id)}
 if(dueMins>capacity){add('warning','Today needs more time',`${fmtMin(dueMins)} of due work exceeds your ${fmtMin(capacity)} available time by ${fmtMin(dueMins-capacity)}. Adjust availability or reprioritize.`, 'Adjust availability','settings','')}
 const upcoming=open.filter(t=>t.due>now&&t.due<=dateKey(plusDays(new Date(),14)));
 const free=Math.max(0,capacity-dueMins);
 const candidate=upcoming.filter(t=>taskDuration(t)>0&&taskDuration(t)<=free).sort((a,b)=>a.due.localeCompare(b.due)||taskDuration(a)-taskDuration(b))[0];
 if(candidate){add('opportunity','Use your available time',`You have ${fmtMin(free)} unallocated today. Consider moving “${candidate.title}” (${fmtMin(taskDuration(candidate))}, due ${fmtDate(candidate.due)}) to today.`, 'Move to today','today',candidate.id)}
 const typo=open.find(t=>/\b(remaind|reminde|remeind|remindd)\b/i.test(t.title));
 if(typo){let clean=typo.title.replace(/\b(remaind|reminde|remeind|remindd)\b/ig,'remind');add('clarity','Make this task clearer',`“${typo.title}” may contain a typo. Suggested title: “${clean}”.`, 'Review rename','rename',typo.id)}
 const milestone=open.find(t=>/\b(start date|first day|anniversary|birthday|ceremony|holiday|graduation date)\b/i.test(t.title)&&taskDuration(t)>=30);
 if(milestone){add('clarity','Is this a task or a milestone?',`“${milestone.title}” is set to ${fmtMin(taskDuration(milestone))}. If it is only a date to remember, review its details. If preparation is needed, add a separate actionable task.`, 'Add preparation','prepare',milestone.id)}
 const riskData=calculateIntelligence();
 if(riskData.peakGap>0&&!messages.some(m=>m.type==='warning'))add('warning','Upcoming deadlines may be tight',`Your estimated workload exceeds available time by up to ${fmtMin(riskData.peakGap)} before upcoming deadlines.`, 'Review tasks','tasks','');
 if(!messages.length)add('success',open.length?'Your plan looks manageable':'You have a clear day',open.length?'No immediate workload conflict detected. Keep tasks and available time updated for better suggestions.':'Add your next responsibility to get personalized recommendations.','Add task','add','');
 return messages.slice(0,4);
}

function insightAction(action,id){
 const t=state.tasks.find(x=>x.id===id);
 if(action==='settings')return go('settings');
 if(action==='tasks')return go('tasks');
 if(action==='add')return modal();
 if(!t)return;
 if(action==='edit')return modal(t);
 if(action==='today'){
  if(!confirm(`Move “${t.title}” from ${fmtDate(t.due)} to today? This changes its deadline.`))return;
  t.due=today();save();render();return;
 }
 if(action==='rename'){
  const proposal=t.title.replace(/\b(remaind|reminde|remeind|remindd)\b/ig,'remind');
  const name=prompt('Review task title before saving:',proposal);
  if(name===null)return;
  const clean=name.trim();if(!clean||clean.length>180)return alert('Enter a title between 1 and 180 characters.');
  t.title=clean;save();render();return;
 }
 if(action==='prepare'){
  modal();const input=document.getElementById('task-title');if(input)input.value='Prepare for '+t.title;
  const due=document.getElementById('task-due');if(due)due.value=t.due;
 }
}

<hr style="border:0;border-top:1px solid #edf0f5;margin:25px 0"><h3>Task reminders</h3><div class="reminder-banner"><strong>Phone notification limitation</strong>Local HTML can show alerts when it is open, and system notifications where the browser permits. It cannot reliably send notifications to your phone when the website is closed. For that, FocusFlow will need HTTPS hosting, a PWA, a push subscription, and a server to send push messages.</div><div class="settings-row"><div><b>Enable reminders while app is open</b><p class="muted">You choose the reminder date/time on each task.</p></div><input type="checkbox" id="enable-reminders" ${state.reminderEnabled?'checked':''} style="width:22px;height:22px"></div><div class="form-actions"><button class="button secondary small" id="test-reminder">Test reminder</button><button class="button secondary small" id="allow-notifications">Allow system notifications</button></div><hr style="border:0;border-top:1px solid #edf0f5;margin:25px 0"><h3>Weekly availability</h3><p class="muted">Optional hours for each weekday. Blank uses default availability.</p><div class="weekly-grid">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((name,i)=>`<div class="field"><label for="week-${i}">${name}</label><input id="week-${i}" data-weekly="${i}" type="number" min="0" max="24" step="0.5" placeholder="Default" value="${Object.prototype.hasOwnProperty.call(state.weekly||{},i)?state.weekly[i]:''}"></div>`).join('')}</div><h3>Daily overrides (next 14 days)</h3><p class="muted">Leave a field empty to use your default hours. Enter 0 for an unavailable day.</p>${upcoming.map(date=>`<div class="settings-row" style="padding:9px 0;border-bottom:1px solid #f2f3f7"><label for="day-${date}" style="font-size:13px">${fmtDate(date)}</label><input id="day-${date}" data-availability="${date}" type="number" step="0.5" min="0" max="24" placeholder="Default" value="${Object.prototype.hasOwnProperty.call(state.availability,date)?state.availability[date]:''}"></div>`).join('')}<div class="form-actions"><button class="button" id="save-settings">Save settings</button></div><hr style="border:0;border-top:1px solid #edf0f5;margin:25px 0"><div class="settings-row"><div><b>Export your tasks</b><p class="muted">Download your tasks and availability as a JSON backup.</p></div><button class="button secondary small" id="export">Export JSON</button></div><div class="settings-row" style="margin-top:15px"><div><b>Import an earlier backup</b><p class="muted">Restore exported FocusFlow 2.0 or 3.0 tasks and availability. Replaces the current local data.</p></div><label class="button secondary small" for="import-file" style="cursor:pointer">Import JSON</label><input id="import-file" type="file" accept=".json,application/json" class="hidden"></div><div style="height:20px"></div><div class="settings-row"><div><b>Reset prototype</b><p class="muted">Permanently remove all locally saved tasks and settings.</p></div><button class="button danger small" id="reset">Clear all data</button></div>`)}

// FocusFlow 4.5 background push: the HTML stays standalone; service worker and backend are hosted companions.
function setPushStatus(message){const el=document.getElementById('push-state-message');if(el)el.textContent=message;console.info('FocusFlow Push:',message)}
function vapidBytes(key){const pad='='.repeat((4-key.length%4)%4);const binary=atob((key+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(binary,ch=>ch.charCodeAt(0))}
async function pushRegistration(){if(!window.isSecureContext||!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('Push requires HTTPS and a supported browser. On iPhone install FocusFlow to the Home Screen first.');return navigator.serviceWorker.register('/sw.js',{scope:'/'})}
async function enablePush(){
 if(!cloudClient||!cloudUser||cloudMode!=='cloud')throw Error('Sign in to FocusFlow first.');
 if(PUSH_VAPID_PUBLIC_KEY.startsWith('REPLACE_'))throw Error('Deploy with your generated VAPID public key in index.html first.');
 const reg=await pushRegistration();const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('Notification permission was not granted.');
 let subscription=await reg.pushManager.getSubscription();
 if(!subscription)subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapidBytes(PUSH_VAPID_PUBLIC_KEY)});
 const json=subscription.toJSON();
 const {error}=await cloudClient.from('focusflow_push_subscriptions').upsert({user_id:cloudUser.id,endpoint:json.endpoint,subscription:json},{onConflict:'endpoint'});
 if(error)throw error;
 await syncPushMirror(cloudUser.id,state);
 return 'Push subscription enabled on this device.';
}
async function disablePush(){const reg=await navigator.serviceWorker.getRegistration('/');const sub=await reg?.pushManager?.getSubscription();if(sub){if(cloudClient&&cloudUser){const {error}=await cloudClient.from('focusflow_push_subscriptions').delete().eq('endpoint',sub.endpoint).eq('user_id',cloudUser.id);if(error)throw error}await sub.unsubscribe()}return 'Device unsubscribed.'}
async function syncPushMirror(uid,data){
 if(!cloudClient||!cloudUser||cloudUser.id!==uid||cloudMode!=='cloud')return;
 const items=(data.tasks||[]).filter(t=>!t.done&&t.remindAt&&Number.isFinite(Date.parse(t.remindAt))).map(t=>({id:String(t.id),title:String(t.title).slice(0,140),remindAt:new Date(t.remindAt).toISOString()}));
 const {error}=await cloudClient.rpc('focusflow_replace_reminders',{items});if(error)throw error;
 const p=data.notificationPrefs||{};
 const {error:prefError}=await cloudClient.from('focusflow_notification_prefs').upsert({user_id:uid,enabled:p.enabled!==false,quiet_enabled:!!p.quietEnabled,quiet_start:Number(p.quietStart??22),quiet_end:Number(p.quietEnd??7),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',updated_at:new Date().toISOString()},{onConflict:'user_id'});
 if(prefError)throw prefError;
}
function taskPresetTime(){const date=document.getElementById('task-due')?.value;if(!date)return;let when=new Date(date+'T09:00:00');const preset=document.getElementById('task-remind-preset')?.value;if(!preset||preset==='custom')return;if(preset!=='at')when=new Date(when.getTime()-Number(preset)*60000);document.getElementById('task-remind').value=dateTimeForInput(when.toISOString());}
function launchNotificationLink(){
 const u=new URL(location.href),id=u.searchParams.get('focusTask');if(!id)return;
 const task=state.tasks.find(x=>x.id===id);if(task){
  go('tasks');if(u.searchParams.get('snooze')==='15'&&!task.done){if(confirm('Snooze reminder for '+task.title+' by 15 minutes?')){task.remindAt=new Date(Date.now()+15*60000).toISOString();save();render()}}
  else modal(task);
 }
 u.searchParams.delete('focusTask');u.searchParams.delete('snooze');history.replaceState(null,'',u.pathname+u.search+u.hash);
}
document.addEventListener('change',e=>{if(e.target.id==='task-remind-preset')taskPresetTime()});
document.addEventListener('click',async e=>{
 const id=e.target.closest('button')?.id;
 if(!['push-enable','push-disable','push-test','push-save-preferences'].includes(id))return;
 try{
  if(id==='push-enable')setPushStatus(await enablePush());
  if(id==='push-disable')setPushStatus(await disablePush());
  if(id==='push-save-preferences'){
   state.notificationPrefs={enabled:document.getElementById('push-preferences-enabled').checked,quietEnabled:document.getElementById('push-quiet-enabled').checked,quietStart:Number(document.getElementById('push-quiet-start').value),quietEnd:Number(document.getElementById('push-quiet-end').value)};
   save();if(cloudUser&&cloudMode==='cloud')await syncPushMirror(cloudUser.id,state);setPushStatus('Preferences saved.');
  }
  if(id==='push-test'){
   if(!cloudUser||cloudMode!=='cloud')throw Error('Sign in first.');
   state.tasks.push({id:crypto.randomUUID(),title:'Test phone notification',due:today(),minutes:5,priority:'low',repeat:'none',remindAt:new Date(Date.now()+65000).toISOString(),done:false});save();
   await flushCloud();if(cloudDirty)throw Error('Cloud sync is not complete.');render();setPushStatus('Test task queued for approximately 1 minute from now. Actual delivery depends on the scheduler.');
  }
 }catch(err){setPushStatus(err.message||String(err))}
});

function render(){let labels={myday:['YOUR DAY','My day','A practical plan for what matters today.'],dashboard:['YOUR WORKSPACE','Your dashboard','Turn deadlines into a realistic plan.'],tasks:['TASK MANAGER','My tasks','Track priorities, deadlines, and estimated effort.'],calendar:['DEADLINE VIEW','Your calendar','See what is due and when.'],settings:['PREFERENCES','Planning settings','Set realistic availability and manage your data.']};const [e,t,s]=labels[page];document.getElementById('page-eyebrow').textContent=e;document.getElementById('page-title').textContent=(page==='myday'||page==='dashboard')?timeGreeting()+', '+displayName()+'!':t;document.getElementById('page-subtitle').textContent=s;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));try{document.getElementById('view').innerHTML=({myday:myDayView,dashboard,tasks:tasksView,calendar:calendarView,settings:settingsView})[page]();}catch(err){console.error('FocusFlow view rendering failed:',err);document.getElementById('view').innerHTML='<div class="card"><h2>Unable to display this section</h2><p>Try reloading the page. Your saved tasks have not been deleted.</p></div>';}updateCloudBar();}
function go(p){if(!['myday','dashboard','tasks','calendar','settings'].includes(p))p='myday';page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function modal(t){editing=t||null;let x=t||{title:'',due:today(),minutes:60,priority:'medium'};document.getElementById('modal-root').innerHTML=`<div class="modal-shell" id="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading"><h2 id="modal-heading">${t?'Edit task':'Create a task'}</h2><form id="task-form"><div class="form-grid"><div class="field full"><label for="task-title">Task title</label><input id="task-title" required maxlength="140" value="${escapeAttr(x.title)}" placeholder="e.g. Finish research paper"></div><div class="field"><label for="task-due">Deadline</label><input id="task-due" type="date" required value="${escapeAttr(x.due)}"></div><div class="field"><label for="task-minutes">Estimated minutes</label><input id="task-minutes" type="number" required min="5" max="100000" step="5" value="${taskDuration(x)}"></div><div class="field full"><label for="task-priority">Priority</label><select id="task-priority">${['high','medium','low'].map(p=>`<option value="${p}" ${p===x.priority?'selected':''}>${p.charAt(0).toUpperCase()+p.slice(1)}</option>`).join('')}</select></div><div class="field full"><label for="task-repeat">Repeat</label><select id="task-repeat">${['none','daily','weekly','monthly'].map(f=>`<option value="${f}" ${f===(x.repeat||'none')?'selected':''}>${f==='none'?'Does not repeat':f.charAt(0).toUpperCase()+f.slice(1)}</option>`).join('')}</select></div><div class="field full"><label for="task-remind">Reminder date & time (optional)</label><input id="task-remind" type="datetime-local" value="${dateTimeForInput(x.remindAt)}"><small class="muted">Use a preset below or choose your own reminder date/time. Phone push requires the hosted setup.</small><select id="task-remind-preset"><option value="custom">Custom reminder date/time</option><option value="at">At task deadline (9 AM)</option><option value="5">5 minutes before deadline (9 AM)</option><option value="15">15 minutes before deadline (9 AM)</option><option value="60">1 hour before deadline (9 AM)</option><option value="1440">1 day before deadline (9 AM)</option></select></div></div><div class="form-actions"><button type="button" id="cancel-modal" class="button secondary">Cancel</button><button type="submit" class="button">${t?'Save changes':'Create task'}</button></div></form></div></div>`;document.getElementById('task-title').focus()}
function closeModal(){document.getElementById('modal-root').innerHTML='';editing=null}
document.addEventListener('submit',e=>{if(e.target.id==='auth-form'){e.preventDefault();signInUser();return}if(e.target.id==='quick-form'){e.preventDefault();let q=parseQuick(document.getElementById('quick-text').value);if(!q.title)return alert('Enter a short task description.');modal();document.getElementById('task-title').value=q.title;document.getElementById('task-due').value=q.due;document.getElementById('task-minutes').value=q.minutes;document.getElementById('task-repeat').value=q.repeat;return}if(e.target.id!=='task-form')return;e.preventDefault();let title=document.getElementById('task-title').value.trim(),due=document.getElementById('task-due').value,minutes=Number(document.getElementById('task-minutes').value),priority=document.getElementById('task-priority').value,repeat=document.getElementById('task-repeat').value,remindRaw=document.getElementById('task-remind').value,remindAt=remindRaw?new Date(remindRaw).toISOString():null;if(!title||!/^\d{4}-\d{2}-\d{2}$/.test(due)||!Number.isFinite(minutes)||minutes<5||minutes>100000)return alert('Enter a task title, valid deadline and effort of at least 5 minutes.');if(editing){Object.assign(state.tasks.find(t=>t.id===editing.id) ,{title,due,minutes,priority,repeat,remindAt})}else state.tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title,due,minutes,priority,repeat,remindAt,done:false});save();closeModal();render();checkReminders()});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(b?.id==='auth-signup')return signUpUser();if(b?.id==='auth-reset'){const email=document.getElementById('auth-email')?.value?.trim();if(!email)return alert('Enter your email address first.');if(!cloudClient)return alert('Supabase is unavailable.');cloudClient.auth.resetPasswordForEmail(email).then(({error})=>alert(error?error.message:'Password reset email requested. Configure your redirect URL in Supabase Auth.'));return}if(!b){if(e.target.id==='modal-overlay')closeModal();return}if(b.id==='account-action'){if(cloudUser)return signOut();return showAuth()}if(b.id==='sync-now')return syncNow();if(b.id==='save-profile'){const v=document.getElementById('profile-name')?.value.trim()||'';if(v.length>60)return alert('Name must be 60 characters or fewer.');state.profileName=v;save();render();return;}if(b.dataset.insightAction)return insightAction(b.dataset.insightAction,b.dataset.insightId);if(b.dataset.page)return go(b.dataset.page);if(b.dataset.go)return go(b.dataset.go);if(b.id==='add-task-top'||b.id==='empty-add'||b.dataset.addTask)return modal();if(b.id==='reset-scenario'){scenario={extra:0,delay:0,newMinutes:0,priority:'high'};render();return}if(b.dataset.delayTask){let t=state.tasks.find(x=>x.id===b.dataset.delayTask);if(t&&confirm('Move deadline for '+t.title+' by 3 days?')){t.due=dateKey(plusDays(parseDate(t.due),3));save();render()}return}if(b.id==='cancel-modal')return closeModal();if(b.dataset.edit)return modal(state.tasks.find(x=>x.id===b.dataset.edit));if(b.dataset.delete){if(confirm('Delete this task?')){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.delete);save();render()}return}if(b.dataset.month!==undefined){let n=Number(b.dataset.month);calendarMonth=n===0?new Date():new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+n,1);render();return}if(b.id==='allow-notifications'){if(!('Notification' in window))return alert('System notifications are not supported by this browser. In-app reminders can still work.');if(!window.isSecureContext)return alert('System notifications require HTTPS or localhost. A file opened directly from disk might not support them.');Notification.requestPermission().then(p=>alert(p==='granted'?'System notifications enabled. Keep the app open to receive reminders.':'Notifications not permitted; in-app reminders remain available.'));return}if(b.id==='test-reminder'){toastReminder({title:'This is your test reminder',due:today()});if('Notification' in window&&Notification.permission==='granted'){try{new Notification('FocusFlow test reminder',{body:'Your reminder settings are working while the page is open.'})}catch(e){}}return}if(b.id==='save-settings'){state.reminderEnabled=document.getElementById('enable-reminders').checked;let weekly={};for(let f of document.querySelectorAll('[data-weekly]')){if(f.value.trim()==='')continue;let h=Number(f.value);if(!Number.isFinite(h)||h<0||h>24)return alert('Weekly hours must be between 0 and 24.');weekly[f.dataset.weekly]=h}let v=Number(document.getElementById('daily-hours').value);if(!Number.isFinite(v)||v<0||v>24)return alert('Default daily hours must be between 0 and 24.');let updates={...state.availability};for(let input of document.querySelectorAll('[data-availability]')){if(input.value.trim()==='')delete updates[input.dataset.availability];else{let h=Number(input.value);if(!Number.isFinite(h)||h<0||h>24)return alert('Override hours must be between 0 and 24.');updates[input.dataset.availability]=h}}state.dailyHours=v;state.availability=updates;state.weekly=weekly;save();render();alert('Availability saved.');return}if(b.id==='reset'){if(confirm('Delete ALL locally saved FocusFlow tasks and settings? This cannot be undone.')){state=structuredClone(initial);save();go('dashboard')}return}if(b.id==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='focusflow-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'){let f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>2000000)return alert('Backup exceeds the 2 MB limit.');try{let data=JSON.parse(await f.text());if(!data||!Array.isArray(data.tasks)||typeof data.availability!=='object'||data.availability===null||data.tasks.length>10000||data.tasks.some(t=>!t||typeof t.title!=='string'||typeof t.due!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.due)||!Number.isFinite(Number(t.minutes))||!['high','medium','low'].includes(t.priority)))throw new Error('Invalid task data');if(!confirm('Replace all current local tasks and settings with this backup?'))return;state={...structuredClone(initial),...data,availability:data.availability||{},weekly:data.weekly||{}};save();go('myday')}catch(err){alert('Could not import this FocusFlow backup: '+err.message)}return}if(['extra-hours','deadline-shift','unexpected-work','unexpected-priority'].includes(e.target.id)){scenario.extra=Number(document.getElementById('extra-hours').value);scenario.delay=Number(document.getElementById('deadline-shift').value);scenario.newMinutes=Number(document.getElementById('unexpected-work').value);scenario.priority=document.getElementById('unexpected-priority').value;render();return}if(!e.target.matches('[data-toggle]'))return;let task=state.tasks.find(t=>t.id===e.target.dataset.toggle);if(task){task.done=e.target.checked;if(task.done)recurComplete(task);save();render()}});
render();initCloud();checkReminders();setInterval(checkReminders,15000);setInterval(()=>{if(page==='myday'||page==='dashboard'){const t=document.getElementById('page-title');if(t)t.textContent=timeGreeting()+', '+displayName()+'!'}},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});window.addEventListener('online',()=>{if(cloudDirty)queueCloudSave()});
})();
</script></body></html>
