}
function getSplitCreateTarget() {
  if (splitCreateState.targetType === "bill") {
    const bill = BILLS.find(b => b.id === splitCreateState.targetId);
    return bill ? { name: bill.name, amount: parseFloat(bill.amount) } : null;
  }
  const tx = TXS.find(t => t.id === splitCreateState.targetId);
  return tx ? { name: tx.description || getCat(tx.category, tx.type).label, amount: parseFloat(tx.amount) } : null;
}
function openSplitCreateModal(targetType, targetId) {
  splitCreateState = { targetType, targetId, mode:"equal", friendIds:[], exact:{}, addingFriend:false };
  renderSplitCreateModal();
  document.getElementById("bill-split-overlay").classList.add("open");
  document.getElementById("bill-split-box").classList.add("open");
}
function closeBillSplitModal() {
  document.getElementById("bill-split-overlay").classList.remove("open");
  document.getElementById("bill-split-box").classList.remove("open");
  splitCreateState = null;
}

function computeFriendBalances() {
  return FRIENDS.map(f => {
    const parts = PARTICIPANTS.filter(p => p.friendId === f.id);
    const pending = parts.filter(p => p.status === "pending");
    const owed = pending.reduce((s,p) => s + (parseFloat(p.amountOwed)||0), 0);
    const lastPart = parts.slice().sort((a,b) => (b.id||0)-(a.id||0))[0];
    const lastSplit = lastPart ? SPLITS.find(s => s.id === lastPart.splitId) : null;
    const lastLabel = lastSplit ? splitSubjectInfo(lastSplit).title : null;
    return { friend: f, owed, pendingCount: pending.length, hasHistory: parts.length > 0, lastLabel };
  }).filter(r => r.hasHistory).sort((a,b) => b.owed - a.owed);
}
async function settleAllForFriend(friendId) {
  const pending = PARTICIPANTS.filter(p => p.friendId === friendId && p.status === "pending");
  if (!pending.length) return;
  const f = FRIENDS.find(x => x.id === friendId);
  if (!confirm(`Mark all ${pending.length} pending split${pending.length>1?"s":""} from ${f?f.name:"this person"} as settled?`)) return;
  for (const p of pending) { await toggleParticipantStatus(p.id); }
  renderMain();
}
/* ══════════════════════════════════════════════
   FINANCIAL HEALTH SCORE
   Every number below is computed from real TXS/BUDGETS/GOALS/BILLS —
   nothing here is a placeholder or a fabricated figure.
   ══════════════════════════════════════════════ */
function computeFinancialHealthScore(monthOverride) {
  const now = new Date();
  const thisM = monthOverride || monthStr(now);
  const refDate = monthOverride ? new Date(monthOverride+"-01") : now;
  const lastM = monthStr(new Date(refDate.getFullYear(), refDate.getMonth()-1, 1));
  const thisTxs = TXS.filter(t => t.date.slice(0,7) === thisM);
  const lastTxs = TXS.filter(t => t.date.slice(0,7) === lastM);
  const income = thisTxs.filter(t=>t.currency==="USD"&&t.type==="income").reduce((s,t)=>s+parseFloat(t.amount),0);
  const expense = thisTxs.filter(t=>t.currency==="USD"&&t.type==="expense").reduce((s,t)=>s+parseFloat(t.amount),0);
  const lastExpense = lastTxs.filter(t=>t.type==="expense").reduce((s,t)=>s+parseFloat(t.amount),0);

  // Savings rate: (income - expense) / income, scaled to 0-100
  const savingsRate = income > 0 ? (income - expense) / income : (expense > 0 ? -1 : 0);
  const savingsScore = clamp(Math.round(50 + savingsRate * 100), 0, 100);

  // Spending control: % of that month's budget categories that stayed within budget
  const thisMonthBudgets = BUDGETS.filter(b => b.month === thisM);
  let spendingScore = 70; // neutral default when there's not enough budget data yet
  if (thisMonthBudgets.length > 0) {
    const withinBudget = thisMonthBudgets.filter(b => {
      const spent = thisTxs.filter(t => t.type==="expense" && t.category===b.category).reduce((s,t)=>s+parseFloat(t.amount),0);
      return spent <= parseFloat(b.amount);
    }).length;
    spendingScore = Math.round((withinBudget / thisMonthBudgets.length) * 100);
  }

  // Bills and Goals reflect current live state regardless of monthOverride — the app
  // doesn't keep historical snapshots of bill/goal status, so trend comparisons below
  // are driven by savings/spending/cash-flow only, which ARE cleanly historical.
  const activeBills = BILLS.filter(b => b.isActive);
  const today = dayStr();
  const billsScore = activeBills.length > 0
    ? Math.round((activeBills.filter(b => !b.nextDue || b.nextDue >= today).length / activeBills.length) * 100)
    : 100;

  // Goals: average progress across active goals, capped at 100 each
  const goalsScore = GOALS.length > 0
    ? Math.round(GOALS.reduce((s,g) => s + clamp((parseFloat(g.currentAmount)/parseFloat(g.targetAmount||1))*100, 0, 100), 0) / GOALS.length)
    : 70; // neutral default with no goals set yet

  // Cash flow: this month's net, scaled against income (or a flat penalty if no income logged)
  const netFlow = income - expense;
  const cashFlowScore = income > 0 ? clamp(Math.round(50 + (netFlow/income) * 100), 0, 100) : (netFlow >= 0 ? 60 : 30);

  const overall = Math.round(savingsScore*0.25 + spendingScore*0.2 + billsScore*0.2 + goalsScore*0.15 + cashFlowScore*0.2);

  // Explanations: only generated when the underlying comparison actually has data on both sides.
  const explanations = [];
  if (lastExpense > 0 && expense > 0) {
    const changePct = Math.round(((expense - lastExpense) / lastExpense) * 100);
    if (changePct <= -5) explanations.push(`Your score is up because total spending is ${Math.abs(changePct)}% lower than last month.`);
    else if (changePct >= 5) explanations.push(`Your score is down because total spending is ${changePct}% higher than last month.`);
  }
  if (income > 0 && savingsRate < 0.2) {
    const targetSavings = Math.round(income * 0.2 - (income - expense));
    if (targetSavings > 0) explanations.push(`Your score can improve by saving about ${fmt(targetSavings)} more this month.`);
  }
  if (activeBills.some(b => b.nextDue && b.nextDue < today)) {
    explanations.push(`You have an overdue bill — catching it up will raise your Bills score.`);
  }
  if (!explanations.length) explanations.push(income===0 && expense===0 ? "Log a few transactions this month to get a real score." : "Keep logging transactions for more personalized explanations.");

  return { overall, breakdown: { savings:savingsScore, spendingControl:spendingScore, bills:billsScore, goals:goalsScore, cashFlow:cashFlowScore }, explanations, income, expense };
}
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function computeHealthTrend() {
  const now = new Date();
  const thisM = monthStr(now);
  const lastM = monthStr(new Date(now.getFullYear(), now.getMonth()-1, 1));
  const cur = computeFinancialHealthScore(thisM);
  const prev = computeFinancialHealthScore(lastM);
  const delta = cur.overall - prev.overall;
  const reasons = [];
  if (cur.breakdown.savings > prev.breakdown.savings) reasons.push("Increased savings");
  if (cur.breakdown.spendingControl > prev.breakdown.spendingControl) reasons.push("Reduced unnecessary spending");
  if (cur.breakdown.bills >= 90) reasons.push("Paid bills on time");
  if (cur.breakdown.cashFlow > prev.breakdown.cashFlow) reasons.push("Improved cash flow");
  return { score: cur.overall, delta, reasons, hasComparison: prev.income > 0 || prev.expense > 0 };
}

/* ══════════════════════════════════════════════
   AUTOMATIC INSIGHTS ENGINE
   Each detector only fires when the underlying data actually
   supports the claim — no insight is shown without real numbers behind it.
   ══════════════════════════════════════════════ */
function generateInsights() {
  const insights = [];
  const now = new Date();
  const thisM = monthStr(now);
  const lastM = monthStr(new Date(now.getFullYear(), now.getMonth()-1, 1));
  const thisTxs = TXS.filter(t => t.date.slice(0,7) === thisM);
  const lastTxs = TXS.filter(t => t.date.slice(0,7) === lastM);
  const income = thisTxs.filter(t=>t.currency==="USD"&&t.type==="income").reduce((s,t)=>s+parseFloat(t.amount),0);
  const today = dayStr();

  // Overspending per category vs last month
  const catTotals = (txs) => { const m = {}; txs.filter(t=>t.type==="expense").forEach(t => { m[t.category] = (m[t.category]||0) + parseFloat(t.amount); }); return m; };
  const thisCat = catTotals(thisTxs), lastCat = catTotals(lastTxs);
  Object.keys(thisCat).forEach(cat => {
    if (lastCat[cat] > 0) {
      const pct = Math.round(((thisCat[cat] - lastCat[cat]) / lastCat[cat]) * 100);
      if (pct >= 25) insights.push({ icon:"trending-up", type:"warning", text:`You've spent ${pct}% more on ${getCat(cat,"expense").label.toLowerCase()} than last month (${fmt(thisCat[cat])} vs ${fmt(lastCat[cat])}).` });
    }
  });

  // Subscriptions: active recurring expenses
  const activeRecurring = RECURRING.filter(r => r.isActive && r.type === "expense");
  if (activeRecurring.length > 0) {
    const monthlyTotal = activeRecurring.reduce((s,r) => s + parseFloat(r.amount) * (r.frequency==="weekly"?4.33:r.frequency==="yearly"?(1/12):1), 0);
    insights.push({ icon:"repeat", type:"info", text:`You have ${activeRecurring.length} recurring payment${activeRecurring.length>1?"s":""} totaling about ${fmt(monthlyTotal)}/month.` });
  }

  // Cash flow risk: upcoming bills (next 30 days) vs this month's income so far
  const in30 = dayStr(new Date(now.getTime() + 30*86400000));
  const upcomingBillsTotal = BILLS.filter(b => b.isActive && b.nextDue && b.nextDue >= today && b.nextDue <= in30).reduce((s,b)=>s+parseFloat(b.amount),0);
  if (income > 0 && upcomingBillsTotal > income) {
    insights.push({ icon:"alert-triangle", type:"risk", text:`Upcoming bills in the next 30 days (${fmt(upcomingBillsTotal)}) exceed income logged this month (${fmt(income)}).` });
  }

  // Savings opportunity: biggest discretionary category this month (excluding rent/bills-type categories)
  const discretionary = Object.entries(thisCat).filter(([cat]) => !["rent","bills","utilities","loan","emi"].includes(cat)).sort((a,b)=>b[1]-a[1])[0];
  if (discretionary && discretionary[1] > 0) {
    insights.push({ icon:"lightbulb", type:"tip", text:`${getCat(discretionary[0],"expense").label} is your top discretionary spend this month at ${fmt(discretionary[1])} — trimming it is the fastest lever on your savings rate.` });
  }

  if (!insights.length) insights.push({ icon:"info", type:"info", text:"Log more transactions to start seeing personalized insights here." });
  return insights.slice(0, 5);
}
function generateDailyInsights() {
  const insights = [];
  const today = dayStr();
  const now = new Date();
  const thisM = monthStr(now);
  const thisTxs = TXS.filter(t => t.date.slice(0,7) === thisM);
  const income = thisTxs.filter(t=>t.currency==="USD"&&t.type==="income").reduce((s,t)=>s+parseFloat(t.amount),0);
  const expense = thisTxs.filter(t=>t.currency==="USD"&&t.type==="expense").reduce((s,t)=>s+parseFloat(t.amount),0);

  const nextIncome = RECURRING.filter(r => r.isActive && r.type==="income" && r.nextDue).sort((a,b)=>a.nextDue.localeCompare(b.nextDue))[0];
  if (nextIncome) insights.push(`You have ${fmt(income-expense)} available until your next paycheck on ${new Date(nextIncome.nextDue).toLocaleDateString("en-US",{month:"short",day:"numeric"})}.`);

  const in3 = dayStr(new Date(now.getTime()+3*86400000));
  const soonBill = BILLS.filter(b => b.isActive && b.nextDue && b.nextDue>=today && b.nextDue<=in3).sort((a,b)=>a.nextDue.localeCompare(b.nextDue))[0];
  if (soonBill) {
    const days = Math.round((new Date(soonBill.nextDue)-new Date(today))/86400000);
    insights.push(`Your ${esc(soonBill.name)} bill (${fmt(parseFloat(soonBill.amount))}) is due in ${days===0?"today":days+" day"+(days>1?"s":"")}.`);
  }

  const todaysTxs = TXS.filter(t => t.date.slice(0,10)===today && t.type==="expense");
  if (todaysTxs.length) {
    const cat = todaysTxs[0].category;
    const ago30 = new Date(now.getTime()-30*86400000);
    const histTxs = TXS.filter(t => t.type==="expense" && t.category===cat && new Date(t.date)>=ago30 && t.date.slice(0,10)!==today);
    if (histTxs.length >= 3) {
      const avgDaily = histTxs.reduce((s,t)=>s+parseFloat(t.amount),0)/30;
      const todayTotal = todaysTxs.filter(t=>t.category===cat).reduce((s,t)=>s+parseFloat(t.amount),0);
      if (avgDaily > 0 && todayTotal > avgDaily*1.5) {
        const pct = Math.round(((todayTotal-avgDaily)/avgDaily)*100);
        insights.push(`You're spending ${pct}% more on ${getCat(cat,"expense").label.toLowerCase()} today than your recent daily average.`);
      }
    }
  }
  if (!insights.length) insights.push("No urgent items today — log a transaction to keep your insights current.");
  return insights.slice(0,3);
}

/* The purchase planner is intentionally a transparent budgeting estimate,

const CF2_RESERVE_KEY = "cf2_planning_reserve";

function cf2UsdNet(){return TXS.filter(t=>t.currency==="USD").reduce((sum,t)=>sum+(t.type==="income"?1:-1)*(Number(t.amount)||0),0);}
function computeAffordData() {
  const opening=cf2StartBalance();
  const recorded=cf2UsdNet();
  const total=opening===null?null:opening+recorded;
  const start=dayStr();const endDate=new Date();endDate.setDate(endDate.getDate()+30);const end=dayStr(endDate);
  const bills=BILLS.filter(b=>b.isActive&&!b.isPaid&&b.nextDue&&b.nextDue>=start&&b.nextDue<=end&&b.currency==="USD").reduce((sum,b)=>sum+(Number(b.amount)||0),0);
  const reserve=cf2Reserve();
  return {opening,recorded,total,bills,reserve,safe:total===null?null:total-bills-reserve,excluded:TXS.filter(t=>t.currency!=="USD").length};
}
function cf2SaveOpening(){
 const el=document.getElementById("cf2-opening");if(!el)return;
 if(el.value.trim()===""){Store.set("cf2_opening_balance_"+(_cachedUserId||"unknown"),null);renderMain();return;}
 const v=Number(el.value);if(!Number.isFinite(v)||Math.abs(v)>1000000000000){alert("Enter a valid starting balance.");return;}
 Store.set("cf2_opening_balance_"+(_cachedUserId||"unknown"),v);renderMain();
}
function updateAffordCalculator() {
  const purchaseEl=document.getElementById("cf2-purchase");
  if (!purchaseEl) return;
  const raw=Number(purchaseEl.value);
  const purchase=Number.isFinite(raw) && raw>=0 ? raw : 0;
  const d=computeAffordData();
  const left=d.safe-purchase;
  const result=document.getElementById("cf2-result");
  const within=d.safe!==null&&left>=0;
  result.className="cf2-status "+(within?"good":"warn");
  result.innerHTML=d.safe===null?`${icon("info")}<div><strong>Set a starting balance</strong><div>Add your starting USD balance above to enable purchase estimates.</div></div>`:`${icon(within?"check-circle-2":"alert-triangle")}<div><strong>${within?"Within your planned spending amount":"Above your planned spending amount"}</strong><div>${within?`Estimated amount remaining: ${fmt(left)}.`:`Exceeds available room by ${fmt(-left)}.`}</div></div>`;
  document.getElementById("cf2-progress").style.width=(d.safe>0?Math.min(100,purchase/d.safe*100):100)+"%";
  document.getElementById("cf2-progress").style.background=within?"var(--green)":"var(--red)";
  refreshIcons();
}
function updateAffordReserve() {
  const el=document.getElementById("cf2-reserve");
  const v=Number(el.value);
  if (!Number.isFinite(v)||v<0) return;
  Store.set(CF2_RESERVE_KEY,v);
  const d=computeAffordData();
  document.getElementById("cf2-safe").textContent=d.safe===null?"Set starting balance":fmt(Math.max(0,d.safe));
  updateAffordCalculator();
}

/* ══════════════════════════════════════════════
   CASHFLOW AUTOPILOT
   Projects goal completion from real 30-day income/expense trend
   (computeForecast) and real recurring/discretionary data
   (generateInsights) — not fabricated dollar suggestions.
   ══════════════════════════════════════════════ */
function computeAutopilot(goal) {
  const forecast = computeForecast();
  const monthlyAbility = forecast.projSavings;
  const remaining = Math.max(parseFloat(goal.targetAmount) - parseFloat(goal.currentAmount), 0);
  let monthsRemaining = null, requiredMonthly = null;
  if (goal.deadline) {
    const now = new Date(), dl = new Date(goal.deadline);
    monthsRemaining = Math.max((dl.getFullYear()-now.getFullYear())*12 + (dl.getMonth()-now.getMonth()) + (dl.getDate()>=now.getDate()?0:-1), 0.1);
    requiredMonthly = remaining / monthsRemaining;
  }
  let status, predictedDate = null;
  if (remaining <= 0) status = "COMPLETE";
  else if (monthlyAbility <= 0) status = "BEHIND";
  else {
    predictedDate = new Date(); predictedDate.setMonth(predictedDate.getMonth() + Math.ceil(remaining/monthlyAbility));
    if (requiredMonthly !== null) status = monthlyAbility >= requiredMonthly*0.95 ? "ON TRACK" : monthlyAbility >= requiredMonthly*0.5 ? "AT RISK" : "BEHIND";
    else status = "ON TRACK";
  }
  const insights = generateInsights().filter(i => i.type !== "risk" || true).slice(0,3).map(i => i.text);
  return { remaining, monthlyAbility, requiredMonthly, monthsRemaining, status, predictedDate, recommendations: insights };
}
function autopilotCard(goal) {
  if (parseFloat(goal.currentAmount) >= parseFloat(goal.targetAmount)) return "";
  const ap = computeAutopilot(goal);
  const statusColor = ap.status === "ON TRACK" ? "var(--green)" : ap.status === "AT RISK" ? "var(--yellow, #e0a63c)" : "var(--red)";
  return `<div class="card-flat" style="padding:12px 14px;margin-top:8px;border-radius:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">

    ${ap.requiredMonthly !== null ? `<div class="caption">Needs ${fmt(ap.requiredMonthly)}/mo · currently saving ~${fmt(Math.max(ap.monthlyAbility,0))}/mo</div>` : `<div class="caption">Saving ~${fmt(Math.max(ap.monthlyAbility,0))}/mo based on the last 30 days</div>`}
    ${ap.predictedDate ? `<div class="caption" style="margin-top:2px">Projected to reach this goal around ${ap.predictedDate.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}</div>` : `<div class="caption" style="margin-top:2px">Not currently saving enough to project a completion date.</div>`}
    ${ap.recommendations.length ? `<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">${ap.recommendations.map(r=>`<div class="caption" style="padding:2px 0">→ ${esc(r)}</div>`).join("")}</div>` : ""}

}

function cf21SafeCSV(v){
  let t=String(v==null?'':v);
  if(/^[\s]*[=+@\-\t\r]/.test(t))t="'"+t; // defend against spreadsheet formula injection
  return '"'+t.replace(/"/g,'""')+'"';
}
function cf21DownloadText(text,name,type){
  const blob=new Blob([text],{type:type||'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function cf21ClientCSV(personId){
  const person=PEOPLE.find(p=>String(p.id)===String(personId));if(!person)return;
  const work=cwEntries(personId).map(w=>({date:w.work_date,type:'Earned',amount:Number(w.amount),notes:w.notes||''}));
  const received=cwPayments(personId).map(t=>({date:t.date.slice(0,10),type:'Received',amount:Number(t.amount),notes:t.notes||''}));
  const rows=[...work,...received].sort((a,b)=>a.date.localeCompare(b.date));
  const earned=cwTotal(work,'amount'),paid=cwTotal(received,'amount');
  const report=[['Client','Date','Entry','Amount (USD)','Notes'],...rows.map(r=>[person.name,r.date,r.type,r.amount.toFixed(2),r.notes]),['TOTAL','', 'Earned',earned.toFixed(2),''],['TOTAL','', 'Received',paid.toFixed(2),''],['BALANCE','',earned>=paid?'Outstanding':'Client credit',Math.abs(earned-paid).toFixed(2),'']];
  const csv='\ufeff'+report.map(cols=>cols.map(cf21SafeCSV).join(',')).join('\r\n');
  cf21DownloadText(csv,'Dhoot_Client_'+dayStr()+'_'+String(person.name).replace(/[^a-z0-9_-]/gi,'_').slice(0,45)+'.csv');
}

function cf21Forecast(days){
  // Simple transparent projection: 90 calendar-day observed USD daily averages.
  const n=Math.min(90,Math.max(7,Number(days)||30));
  const today=new Date(dayStr()+'T12:00:00'),start=new Date(today);start.setDate(start.getDate()-89);
  const from=dayStr(start),to=dayStr(today);
  const relevant=TXS.filter(t=>t.currency==='USD'&&t.date.slice(0,10)>=from&&t.date.slice(0,10)<=to);
  const inflow=cwTotal(relevant.filter(t=>t.type==='income'),'amount'),outflow=cwTotal(relevant.filter(t=>t.type==='expense'),'amount');
  // Divide by window length from earliest included record, not number of recorded days.
  const earliest=relevant.length?relevant.reduce((v,t)=>t.date.slice(0,10)<v?t.date.slice(0,10):v,to):to;
  const age=Math.max(1,Math.min(90,Math.floor((today-new Date(earliest+'T12:00:00'))/86400000)+1));
  return {days:n,samples:relevant.length,observationDays:age,income:inflow/age*n,expense:outflow/age*n,net:(inflow-outflow)/age*n};
}

function setExportPreset(p) { state.exportPreset = p; renderMain(); }

function onExportDateChange() {

function validateExportRange() {

function getExportRange() {

  if (state.exportPreset === "month") { const s = new Date(now.getFullYear(), now.getMonth(), 1); return { start: dayStr(s), end: dayStr(now), label: now.toLocaleDateString("en-US",{month:"long",year:"numeric"}) }; }

function getFilteredTxs() {

  if (state.exportType === "expense") txs = txs.filter(t => t.type === "expense");

function categoryBreakdown(txs, type) {

  return Object.entries(m).sort((a,b) => b[1]-a[1]);
}
function downloadBlob(blob, name) {

function exportCSVFile() {

function exportExcel() {

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows, {skipHeader:true}), "Summary");
  const data = txs.map(t => ({ Date: new Date(t.date).toLocaleDateString(), Type: t.type, Category: getCat(t.category,t.type).label, Amount: parseFloat(t.amount), Currency: t.currency, Description: t.description||"", Notes: t.notes||"" }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), "Transactions");

  doc.setFontSize(9); doc.setTextColor(140,140,150); doc.text(exportReportTitle(), 14, y+7);

  doc.setFontSize(9); doc.setTextColor(90,90,100);
  doc.text(`Account: ${user ? user.email : "Unknown"}`, 14, y);
  doc.text(`Period: ${range.label}`, 14, y+5);
  doc.text(`Exported: ${new Date().toLocaleDateString()}`, 14, y+10);
  y += 20;

  const income = txs.filter(t=>t.type==="income").reduce((s,t)=>s+parseFloat(t.amount),0);
  const expense = txs.filter(t=>t.type==="expense").reduce((s,t)=>s+parseFloat(t.amount),0);
  doc.setFontSize(11); doc.setTextColor(0);
  if (state.exportType !== "expense") { doc.setTextColor(0,200,150); doc.text(`Total Income: $${income.toFixed(2)}`, 14, y); y += 7; }
  if (state.exportType !== "income") { doc.setTextColor(255,92,114); doc.text(`Total Expenses: $${expense.toFixed(2)}`, 14, y); y += 7; }
  if (state.exportType === "all") { doc.setTextColor(0); doc.text(`Net Savings: $${(income-expense).toFixed(2)}`, 14, y); y += 7; }
  y += 4;

  if (state.exportType !== "expense" && income > 0) {
    const inc = categoryBreakdown(txs, "income");
    doc.setFontSize(10); doc.setTextColor(0); doc.text("Income by category", 14, y); y += 3;
    doc.autoTable({ startY:y, head:[["Category","Amount"]], body: inc.map(([c,v])=>[c, `$${v.toFixed(2)}`]), styles:{fontSize:8}, headStyles:{fillColor:[0,200,150]}, margin:{left:14}, tableWidth:90 });
    y = doc.lastAutoTable.finalY + 10;
  }
  if (state.exportType !== "income" && expense > 0) {
    const exp = categoryBreakdown(txs, "expense");
    doc.setFontSize(10); doc.setTextColor(0); doc.text("Expenses by category", 14, y); y += 3;
    doc.autoTable({ startY:y, head:[["Category","Amount"]], body: exp.map(([c,v])=>[c, `$${v.toFixed(2)}`]), styles:{fontSize:8}, headStyles:{fillColor:[255,92,114]}, margin:{left:14}, tableWidth:90 });
    y = doc.lastAutoTable.finalY + 10;
  }

  if (state.exportType === "all") {
    const health = computeFinancialHealthScore();
    doc.setFontSize(10); doc.setTextColor(0); doc.text(`Financial Health Score: ${health.overall}/100`, 14, y); y += 6;
    const recs = generateInsights().slice(0,3);
    if (recs.length) { doc.setFontSize(9); doc.setTextColor(90,90,100); doc.text("AI Recommendations:", 14, y); y += 5; recs.forEach(r => { doc.text(`- ${r.text}`, 16, y, {maxWidth:180}); y += 6; }); y += 4; }
  }

  doc.setFontSize(9); doc.setTextColor(0); doc.text("Transactions", 14, y); y += 2;
  doc.autoTable({ startY:y, head:[["Date","Type","Category","Amount","Description"]], body: txs.map(t => [new Date(t.date).toLocaleDateString(), t.type, getCat(t.category,t.type).label, fmt(parseFloat(t.amount), t.currency), t.description||""]), styles:{fontSize:8}, headStyles:{fillColor:[99,107,255]} });
  doc.save(`dhoot-${state.exportType}-${range.start||"all"}.pdf`);
}
function handleImport(e) {
  const file = e.target.files[0]; if (!file) return;
  Papa.parse(file, { header:true, skipEmptyLines:true, complete: async (r) => {
    const rows = [];
    let skipped = 0;
    const uid = await getUserId();
    r.data.forEach(row => {
      const t = (row.type||"").toLowerCase().trim();
      const a = parseFloat(row.amount);
      const c = (row.category||"").toLowerCase().trim();
      if ((t!=="income" && t!=="expense") || isNaN(a) || a<=0 || !c) { skipped++; return; }
      rows.push({ type:t, amount:a, category:c, description:row.description||"", notes:row.notes||"", currency:row.currency||"USD", date: row.date ? new Date(row.date).toISOString() : new Date().toISOString(), is_recurring:false, recurring_id:null, user_id: uid });
    });
    e.target.value = "";
    if (!rows.length) { alert(`Imported 0, skipped ${skipped}`); return; }
    const { data, error } = await sb.from("transactions").insert(rows).select();
    if (error) { alert("Import failed: " + error.message); return; }
    TXS = data.map(mapTx).concat(TXS);
    alert(`Imported ${data.length}, skipped ${skipped}`);
    renderMain();
  }});
}

function calcSplitAmounts(total, sp) {
  total = Math.round((total || 0) * 100) / 100;
  const friends = FRIENDS.filter(f => sp.friendIds.includes(f.id));
  const participants = (sp.enabled !== false) ? [{ id:"you", name:"You", isPayer:true }, ...friends.map(f => ({ id:f.id, name:f.name, isPayer:false, color:f.avatarColor }))] : [];
  const n = participants.length;
  let amounts = {};
  if (n > 0) {
    if (sp.mode === "equal") {
      const totalCents = Math.round(total * 100);
      const base = Math.floor(totalCents / n);
      const leftover = totalCents - base * n;
      participants.forEach((p, i) => { amounts[p.id] = (base + (i < leftover ? 1 : 0)) / 100; });
    } else {
      participants.forEach(p => { amounts[p.id] = parseFloat(sp.exact[p.id]) || 0; });
    }
  }
  const allocated = Math.round(Object.values(amounts).reduce((s,v) => s+v, 0) * 100) / 100;
  const remaining = Math.round((total - allocated) * 100) / 100;
  const isBalanced = sp.mode === "equal" || Math.abs(remaining) < 0.01;
  return { total, participants, amounts, remaining, isBalanced };
}
function computeSplitCalc() {
  const total = parseFloat(document.getElementById("tx-amount").value) || 0;
  return calcSplitAmounts(total, modalState.split);
}
function renderSplitSection() {

  let html = `<div class="split-card">
    <div class="split-head-row">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:28px;height:28px;border-radius:999px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center">${icon("users",'style="width:14px;height:14px"')}</span>
        <div>
          <div style="font-size:.8125rem;font-weight:700">Split this expense</div>
          <div class="caption">Divide the cost with friends</div>
        </div>
      </div>
      <button class="split-toggle${sp.enabled?" on":""}" onclick="toggleSplitEnabled()"><span class="split-toggle-knob"></span></button>
    </div>`;
  if (sp.enabled) {
    html += `<div class="split-body">
      <p class="label" style="margin-bottom:8px">Split with</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
        ${FRIENDS.map(f => {
          const sel = sp.friendIds.includes(f.id);
          return `<button type="button" class="pill friend-chip${sel?" selected":""}" onclick="toggleSplitFriend(${f.id})">
            <span class="friend-avatar" style="background:${f.avatarColor}">${esc(f.name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase())}</span>
            ${esc(f.name)}${sel?icon("check",'style="width:11px;height:11px"'):""}
          </button>`;
        }).join("")}
        <button type="button" class="pill" onclick="toggleAddFriendInput()">${icon("plus",'style="width:11px;height:11px"')} Add friend</button>
      </div>
      ${sp.addingFriend ? `<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
        <input class="input" id="new-friend-name" placeholder="Friend's name" onkeydown="if(event.key==='Enter')document.getElementById('new-friend-email').focus();">
        <input class="input" id="new-friend-email" type="email" placeholder="Email (optional, for notifications)" onkeydown="if(event.key==='Enter')submitNewFriend();">

      <div class="split-mode-tabs">
        <button class="split-mode-tab${sp.mode==="equal"?" active":""}" onclick="setSplitMode('equal')">Split Equally</button>
        <button class="split-mode-tab${sp.mode==="exact"?" active":""}" onclick="setSplitMode('exact')">Split Exactly</button>
      </div>`;
    if (calc.participants.length > 1) {
      html += calc.participants.map(p => `<div class="split-participant-row">
        <span style="font-size:.75rem">${esc(p.name)}${p.isPayer?' <span style="color:var(--text-4);font-size:.625rem">(paid)</span>':""}</span>
        ${sp.mode === "equal"
          ? `<span class="mono" style="font-size:.75rem">${fmt(calc.amounts[p.id]||0)}</span>`
          : `<input type="number" step="0.01" min="0" class="split-exact-input" value="${sp.exact[p.id] ?? (calc.amounts[p.id]||0).toFixed(2)}" oninput="setSplitExactAmount('${p.id}', this.value)">`
        }
      </div>`).join("");
      if (sp.mode === "exact") {
        const bal = calc.isBalanced;

          ${bal?"":`<span class="mono">${fmt(Math.abs(calc.remaining))}</span>`}
        </div>`;
      }
    } else {
      html += `<p class="caption" style="text-align:center;padding:14px 0">Pick at least one friend to split with.</p>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
  refreshIcons();
}

let authMode = "signin"; // signin | signup | forgot | reset

function renderAuthScreen() {
  const card = document.getElementById("auth-card");
  const brand = `<div class="brand" style="justify-content:center;margin-bottom:22px">

        ${msgs}
        <button type="submit" class="btn-primary" id="auth-submit" style="width:100%">Send Reset Link</button>
      </form>
      <button style="${linkBtnStyle};display:block;margin:14px auto 0" onclick="setAuthMode('signin')">Back to sign in</button>`;
  } else {
    body = `
      <div class="manage-tabs" style="margin-bottom:16px">
        <button class="pill ${authMode==="signin"?"active":""}" onclick="setAuthMode('signin')" style="flex:1;justify-content:center">Sign In</button>
        <button class="pill ${authMode==="signup"?"active":""}" onclick="setAuthMode('signup')" style="flex:1;justify-content:center">Sign Up</button>
      </div>

        <input class="input" id="auth-email" type="email" autocomplete="email" placeholder="Email" style="margin-bottom:10px">
        <input class="input" id="auth-password" type="password" autocomplete="${authMode==="signin"?"current-password":"new-password"}" placeholder="Password" style="margin-bottom:8px">
        <div style="text-align:right;margin-bottom:10px;min-height:14px">${authMode==="signin"?`<button type="button" style="${linkBtnStyle}" onclick="setAuthMode('forgot')">Forgot password?</button>`:""}</div>

function setAuthMode(mode) { authMode = mode; renderAuthScreen(); }
function hideAuthMsgs() {
  const e1 = document.getElementById("auth-error"), e2 = document.getElementById("auth-info");
  if (e1) e1.style.display = "none";
  if (e2) e2.style.display = "none";
}
function showAuthError(msg) { hideAuthMsgs(); const el = document.getElementById("auth-error"); el.textContent = msg; el.style.display = "block"; }
function showAuthInfo(msg) { hideAuthMsgs(); const el = document.getElementById("auth-info"); el.textContent = msg; el.style.display = "block"; }

async function submitAuth() {
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  hideAuthMsgs();
  if (!email || !password) { showAuthError("Enter both email and password."); return; }
  const btn = document.getElementById("auth-submit");
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
  try {
    if (authMode === "signin") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (data.session === null) { showAuthInfo("Account created — check your email to confirm before signing in."); btn.disabled = false; btn.textContent = orig; return; }
    }
  } catch (err) {
    showAuthError(err.message || "Something went wrong.");
    btn.disabled = false; btn.textContent = orig;
  }
}
async function submitForgot() {
  const email = document.getElementById("auth-email").value.trim();
  hideAuthMsgs();
  if (!email) { showAuthError("Enter your email."); return; }
  const btn = document.getElementById("auth-submit");
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split("#")[0] });
    if (error) throw error;
    showAuthInfo("Check your email for a password reset link.");
  } catch (err) {
    showAuthError(err.message || "Something went wrong.");
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}
async function submitReset() {
  const pw = document.getElementById("auth-password").value;
  const pw2 = document.getElementById("auth-password2").value;
  hideAuthMsgs();
  if (!pw || pw.length < 6) { showAuthError("Password must be at least 6 characters."); return; }
  if (pw !== pw2) { showAuthError("Passwords don't match."); return; }
  const btn = document.getElementById("auth-submit");
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
  try {
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) throw error;
    showAuthInfo("Password updated — signing you in...");
    setTimeout(() => { authMode = "signin"; hideAuthScreen(); bootApp(); }, 1000);
  } catch (err) {
    showAuthError(err.message || "Something went wrong.");
    btn.disabled = false; btn.textContent = orig;
  }
}
async function handleSignOut() { await sb.auth.signOut(); }

function showAuthScreen() { document.getElementById("auth-screen").style.display = "flex"; }
function hideAuthScreen() { document.getElementById("auth-screen").style.display = "none"; }

async function bootApp() {
  document.getElementById("main-content").innerHTML = `
    <div class="skeleton" style="height:120px;margin-bottom:20px"></div>
    <div class="skeleton" style="height:180px;margin-bottom:20px"></div>
    <div class="skeleton" style="height:220px"></div>`;
  try {
    const sessionUid=await getUserId();
    if(!sessionUid)throw new Error('Not authenticated');
    await loadAllFromSupabase();
    await dhootLoadWork();
    CHAT_MSGS=cf21GetChatHistory() || [{role:'assistant',html:'Ask me about your spending, budgets, and bills. Answers are computed locally from your loaded records.'}];
  } catch (err) {
    console.error(err);
    document.getElementById("main-content").innerHTML = `<div class="card empty-state">${icon("cloud-off")}<p class="heading-md" style="margin-bottom:4px">Can't reach the database</p><p class="body-sm">Check your connection and reload.</p></div>`;
    refreshIcons();
    return;
  }
  renderMain();
  refreshIcons();
}

async function startApp() {
  applyTheme();
  refreshIcons();
  renderAuthScreen();
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
      authMode = "reset"; renderAuthScreen(); showAuthScreen();
    } else if (event === "SIGNED_IN" || event === "INITIAL_SESSION") {
      if (session) {
        if (authMode !== "reset") { hideAuthScreen(); bootApp(); }
      } else {
        authMode = "signin"; renderAuthScreen(); showAuthScreen();
      }
    } else if (event === "SIGNED_OUT") {
      authMode = "signin"; renderAuthScreen(); showAuthScreen();
      document.getElementById("main-content").innerHTML = "";
      TXS = []; BUDGETS = []; GOALS = []; BILLS = []; RECURRING = [];
      CLIENT_WORK = []; dhootWork = []; dhootRates = []; dhootClock = null; dhootWorkError = ""; clientLedgerError = ""; cf21LoadWarnings=[]; _cachedUserId = null;
      CHAT_MSGS = [{role:'assistant',html:'Welcome to Dhoot. Sign in to view your private chat history.'}];
    }
  });
}

function init() { startApp(); }
init();
</script>
<template id="dhoot-db-sql">-- Dhoot unified work tracking: additive schema for EXISTING CashFlow Supabase project.
-- Do not run database reset scripts or migrate by swapping API keys.
begin;
create table if not exists public.dhoot_work_rates(
 id uuid primary key default gen_random_uuid(), user_id uuid not null references auth.users(id) on delete cascade,
 effective_date date not null, hourly_rate numeric(10,2) not null check(hourly_rate&gt;=0 and hourly_rate&lt;=10000),
 created_at timestamptz not null default now());
create index if not exists dhoot_work_rates_user_date on public.dhoot_work_rates(user_id,effective_date desc);
create table if not exists public.dhoot_work_shifts(
 id uuid primary key default gen_random_uuid(),user_id uuid not null references auth.users(id) on delete cascade,
 work_date date not null,start_time time not null,end_time time not null,
 break_minutes integer not null default 0 check(break_minutes between 0 and 1439),
 paid_hours numeric(7,2) not null check(paid_hours&gt;0 and paid_hours&lt;=24),
 created_at timestamptz not null default now());
create index if not exists dhoot_work_shifts_user_date on public.dhoot_work_shifts(user_id,work_date desc);
create table if not exists public.dhoot_work_clock(
 id uuid primary key default gen_random_uuid(),user_id uuid not null references auth.users(id) on delete cascade,
 started_at timestamptz not null default now(),ended_at timestamptz,break_started_at timestamptz,
 break_seconds integer not null default 0,status text not null default &#x27;working&#x27; check(status in (&#x27;working&#x27;,&#x27;break&#x27;,&#x27;completed&#x27;)),
 created_at timestamptz not null default now());
create unique index if not exists dhoot_one_open_clock on public.dhoot_work_clock(user_id) where ended_at is null;
-- Enforce RLS. Never allow client to change clock timestamps.
alter table public.dhoot_work_rates enable row level security;
alter table public.dhoot_work_shifts enable row level security;
alter table public.dhoot_work_clock enable row level security;
drop policy if exists dhoot_rates_own_read on public.dhoot_work_rates;
create policy dhoot_rates_own_read on public.dhoot_work_rates for select to authenticated using(user_id=(select auth.uid()));
drop policy if exists dhoot_rates_own_insert on public.dhoot_work_rates;
create policy dhoot_rates_own_insert on public.dhoot_work_rates for insert to authenticated with check(user_id=(select auth.uid()));
drop policy if exists dhoot_shifts_own_read on public.dhoot_work_shifts;
create policy dhoot_shifts_own_read on public.dhoot_work_shifts for select to authenticated using(user_id=(select auth.uid()));
drop policy if exists dhoot_shifts_own_insert on public.dhoot_work_shifts;
create policy dhoot_shifts_own_insert on public.dhoot_work_shifts for insert to authenticated with check(user_id=(select auth.uid()));
drop policy if exists dhoot_shifts_own_delete on public.dhoot_work_shifts;
create policy dhoot_shifts_own_delete on public.dhoot_work_shifts for delete to authenticated using(user_id=(select auth.uid()));
drop policy if exists dhoot_clock_own_read on public.dhoot_work_clock;
create policy dhoot_clock_own_read on public.dhoot_work_clock for select to authenticated using(user_id=(select auth.uid()));
revoke all on public.dhoot_work_rates,public.dhoot_work_shifts,public.dhoot_work_clock from anon,authenticated;
grant select,insert on public.dhoot_work_rates to authenticated;
grant select,insert,delete on public.dhoot_work_shifts to authenticated;
grant select on public.dhoot_work_clock to authenticated;
create or replace function public.dhoot_clock_action(p_action text) returns jsonb
language plpgsql security definer set search_path=&#x27;&#x27; as $$
declare uid uuid:=auth.uid(); row_now timestamptz:=clock_timestamp(); s public.dhoot_work_clock%rowtype;
sec numeric; ph numeric; local_start timestamp; local_end timestamp;
begin
 if uid is null then raise exception &#x27;Sign in required&#x27;;end if;
 perform pg_advisory_xact_lock(hashtextextended(uid::text,0));
 select * into s from public.dhoot_work_clock where user_id=uid and ended_at is null for update;
 if p_action=&#x27;in&#x27; then
   if s.id is not null then raise exception &#x27;Already clocked in&#x27;; end if;
   insert into public.dhoot_work_clock(user_id,started_at,status) values(uid,row_now,&#x27;working&#x27;) returning * into s;
 elsif p_action=&#x27;break_start&#x27; then
   if s.id is null or s.status&lt;&gt;&#x27;working&#x27; then raise exception &#x27;Not working&#x27;;end if;
   update public.dhoot_work_clock set status=&#x27;break&#x27;,break_started_at=row_now where id=s.id returning * into s;
 elsif p_action=&#x27;break_end&#x27; then
   if s.id is null or s.status&lt;&gt;&#x27;break&#x27; then raise exception &#x27;No open break&#x27;;end if;
   update public.dhoot_work_clock set status=&#x27;working&#x27;,break_seconds=break_seconds+greatest(0,floor(extract(epoch from row_now-break_started_at))::integer),break_started_at=null where id=s.id returning * into s;
 elsif p_action=&#x27;out&#x27; then
   if s.id is null or s.status&lt;&gt;&#x27;working&#x27; then raise exception &#x27;Not working or break is still open&#x27;;end if;
   sec=extract(epoch from row_now-s.started_at)-s.break_seconds;
   ph=round(sec/3600,2);
   if ph&lt;=0 or ph&gt;24 then raise exception &#x27;Out-of-range shift: contact administrator for correction&#x27;;end if;
   -- Work date uses Pacific time for the original business. Adapt in a planned timezone upgrade.
   local_start=s.started_at at time zone &#x27;America/Los_Angeles&#x27;;
   local_end=row_now at time zone &#x27;America/Los_Angeles&#x27;;
   insert into public.dhoot_work_shifts(user_id,work_date,start_time,end_time,break_minutes,paid_hours)
      values(uid,local_start::date,local_start::time,local_end::time,round(s.break_seconds/60.0)::integer,ph);
   update public.dhoot_work_clock set status=&#x27;completed&#x27;,ended_at=row_now where id=s.id returning * into s;
 else raise exception &#x27;Invalid action&#x27;;end if;
 return jsonb_build_object(&#x27;status&#x27;,s.status,&#x27;id&#x27;,s.id,&#x27;started_at&#x27;,s.started_at,&#x27;ended_at&#x27;,s.ended_at);
end;$$;
revoke all on function public.dhoot_clock_action(text) from public,anon;
grant execute on function public.dhoot_clock_action(text) to authenticated;
commit;
notify pgrst,&#x27;reload schema&#x27;;
</template>
<script id="dhoot-work-core">
// One account, one Supabase project, one navigation. Work earnings are estimates,
// NOT received income. Existing financial tables and records are untouched.
let dhootWork=[], dhootRates=[], dhootClock=null, dhootWorkError='', dhootWorkBusy=false;
const dhootEsc = esc;
const dhootNum=x=>Number(x)||0;
const dhootMoney=x=>fmt(dhootNum(x),'USD');
const dhootToday=()=>dayStr();
const dhootRateAt=dt=>{
 const rows=[...dhootRates].filter(r=>r.effective_date<=dt).sort((a,b)=> b.effective_date.localeCompare(a.effective_date)||(b.created_at||'').localeCompare(a.created_at||''));
 return rows.length?dhootNum(rows[0].hourly_rate):0;
};
function dhootBreakdown(){
 const records=[...dhootWork].sort((a,b)=>a.work_date.localeCompare(b.work_date)||a.start_time.localeCompare(b.start_time)||String(a.created_at).localeCompare(String(b.created_at)));
 const dayHours=new Map(), out=new Map();
 for(const r of records){const used=dayHours.get(r.work_date)||0, h=dhootNum(r.paid_hours),regular=Math.min(h,Math.max(0,8-used)),ot=Math.max(0,h-regular),rate=dhootRateAt(r.work_date);dayHours.set(r.work_date,used+h);out.set(r.id,{h,regular,ot,rate,gross:(regular+ot*1.5)*rate})}
 return out;
}
async function dhootLoadWork(){
 dhootWorkError='';
 const [shift,rate,clock]=await Promise.all([
  sb.from('dhoot_work_shifts').select('*').order('work_date',{ascending:false}),
  sb.from('dhoot_work_rates').select('*').order('effective_date',{ascending:false}),
  sb.from('dhoot_work_clock').select('*').is('ended_at',null).limit(1).maybeSingle()
 ]);
 const errors=[shift,rate,clock].filter(x=>x.error).map(x=>x.error.message);
 if(errors.length)dhootWorkError='Work setup required: '+errors.join(' · ');
 dhootWork=shift.data||[];dhootRates=rate.data||[];dhootClock=clock.data||null;
}
function dhootWorkTotals(month=monthStr(new Date())){
 const calc=dhootBreakdown(),current=dhootWork.filter(x=>x.work_date.slice(0,7)===month);
 return {count:current.length,hours:current.reduce((n,x)=>n+dhootNum(x.paid_hours),0),earned:current.reduce((n,x)=>n+(calc.get(x.id)?.gross||0),0),overtime:current.reduce((n,x)=>n+(calc.get(x.id)?.ot||0),0)};
}
function dhootOverview(){
 if(dhootWorkError)return `<section class="dhoot-overview"><div class="label">Work & payroll</div><p class="body-sm" style="margin-top:7px">Work tracking setup is not complete. Open <button style="text-decoration:underline;color:var(--blue)" onclick="switchTab('work')">Work</button> for instructions. Your financial records are unaffected.</p></section>`;
 const t=dhootWorkTotals();return `<section class="dhoot-overview"><div class="label">WORK EARNINGS · ${dhootEsc(monthStr(new Date()))}</div><div class="dhoot-mini"><div><span class="caption">Estimated gross pay</span><strong>${dhootMoney(t.earned)}</strong></div><div><span class="caption">Paid hours</span><strong>${t.hours.toFixed(2)} h</strong></div><div><span class="caption">Recorded shifts</span><strong>${t.count}</strong></div></div><p class="dhoot-help">Work earnings are not added to received income. Record payments separately to avoid double-counting.</p><button class="pill active" onclick="switchTab('work')" style="margin-top:10px">Manage shifts →</button></section>`;
}
function dhootWorkView(){
 const t=dhootWorkTotals(),calc=dhootBreakdown(),active=dhootClock,working=active?.status==='working',onBreak=active?.status==='break';
 return `<section class="dhoot-work-wrap"><div class="dhoot-top"><div><div class="label">WORKSPACE / PAYROLL</div><h1 class="heading-xl" style="margin-top:7px">Work & Earnings</h1><p class="body-sm" style="margin-top:7px">One account for shifts, payroll estimates, clients, and finance.</p></div><button class="dhoot-btn" onclick="dhootExportShifts()">↓ Export shifts</button></div>
 ${dhootWorkError?`<div class="dhoot-error" role="alert"><b>Complete one-time database setup</b><p style="margin-top:5px">${dhootEsc(dhootWorkError)}</p><p style="margin-top:6px">Click <b>Copy database setup SQL</b> below, then paste and run it in your <b>existing Supabase project</b> SQL Editor. Do not run any older Fire & Ice full reset SQL.</p><button class="dhoot-btn primary" onclick="dhootCopySQL()" style="margin-top:10px">Copy setup SQL</button><textarea id="dhoot-sql-view" class="input" style="margin-top:8px;min-height:100px;display:none" readonly></textarea></div>`:''}
 <div class="dhoot-stats"><div class="card-flat dhoot-stat"><small>Gross earnings · this month</small><strong>${dhootMoney(t.earned)}</strong></div><div class="card-flat dhoot-stat"><small>Paid hours · this month</small><strong>${t.hours.toFixed(2)} h</strong></div><div class="card-flat dhoot-stat"><small>Daily overtime · this month</small><strong>${t.overtime.toFixed(2)} h</strong></div></div>
 <div class="dhoot-layout"><section class="card-flat dhoot-panel"><h3>Live time clock</h3><p class="body-sm">${active? (onBreak?'On break': 'Shift in progress'):'Not clocked in'}${active?' · Started '+dhootEsc(new Date(active.started_at).toLocaleString()):''}</p><div class="dhoot-actions"><button class="dhoot-btn primary" onclick="dhootClockAction('in')" ${active||dhootWorkBusy||dhootWorkError?'disabled':''}>Clock in</button><button class="dhoot-btn" onclick="dhootClockAction('out')" ${!working||dhootWorkBusy||dhootWorkError?'disabled':''}>Clock out</button><button class="dhoot-btn" onclick="dhootClockAction('break_start')" ${!working||dhootWorkBusy||dhootWorkError?'disabled':''}>Start break</button><button class="dhoot-btn" onclick="dhootClockAction('break_end')" ${!onBreak||dhootWorkBusy||dhootWorkError?'disabled':''}>End break</button></div><p class="dhoot-help">Server records clock timestamps. A shift over 24 hours needs administrator review. End a break before clocking out.</p></section>
 <section class="card-flat dhoot-panel"><h3>Hourly rate</h3><p class="body-sm">Current estimate: <b>${dhootMoney(dhootRateAt(dhootToday()))}/hr</b></p><form onsubmit="dhootSaveRate(event)"><div class="dhoot-field"><label>Rate ($ per hour)</label><input class="input" type="number" name="rate" min="0" max="10000" step="0.01" required></div><div class="dhoot-field"><label>Effective date</label><input class="input" type="date" name="date" value="${dhootToday()}" required></div><button class="dhoot-btn primary" style="width:100%" ${dhootWorkError?'disabled':''}>Save rate</button></form><p class="dhoot-help">Historical shifts use the applicable effective-dated rate.</p></section></div>
 <section class="card-flat dhoot-panel"><h3>Manual shift entry</h3><form onsubmit="dhootSaveShift(event)"><div class="dhoot-layout"><div class="dhoot-field"><label>Shift date</label><input class="input" type="date" name="date" value="${dhootToday()}" required></div><div class="dhoot-field"><label>Unpaid break (minutes)</label><input class="input" type="number" name="break" value="0" min="0" max="1439" required></div><div class="dhoot-field"><label>Start</label><input class="input" type="time" name="start" value="09:00" required></div><div class="dhoot-field"><label>End</label><input class="input" type="time" name="end" value="17:00" required></div></div><button class="dhoot-btn primary" style="width:100%;margin-top:10px" ${dhootWorkError?'disabled':''}>Save shift</button></form><p class="dhoot-help">Daily overtime illustration: above 8 hours per work date at 1.5×. Different states may require weekly overtime, double time, or different break rules. Not an official payroll calculation.</p></section>
 <section class="card-flat dhoot-panel"><h3>Shift history</h3>${dhootWork.length?dhootWork.map(s=>{const b=calc.get(s.id)||{h:0,ot:0,gross:0,rate:0};return `<div class="dhoot-record"><div><strong style="font-size:13px">${dhootEsc(s.work_date)}</strong><p class="caption" style="margin-top:4px">${dhootEsc(s.start_time.slice(0,5))}–${dhootEsc(s.end_time.slice(0,5))} · ${b.h.toFixed(2)}h · overtime ${b.ot.toFixed(2)}h</p></div><div style="text-align:right"><strong style="font-size:13px">${dhootMoney(b.gross)}</strong><button class="pill" style="font-size:10px;color:var(--red)" onclick="dhootDeleteShift('${dhootEsc(s.id)}')">Delete</button></div></div>`}).join(''):'<div class="empty-state" style="padding:26px"><p class="body-sm">No shifts recorded yet.</p></div>'}</section>
 </section>`;
}
function dhootHours(a,b,breaks){const parts=s=>s.split(':').map(Number);const [ah,am]=parts(a),[bh,bm]=parts(b);if([ah,am,bh,bm].some(n=>!Number.isFinite(n)))return 0;let mins=bh*60+bm-ah*60-am;if(mins<=0)mins+=1440;return (mins-breaks)/60;}
async function dhootSaveShift(e){e.preventDefault();if(dhootWorkBusy)return;const f=new FormData(e.target), date=String(f.get('date')),start=String(f.get('start')),end=String(f.get('end')),breaks=Number(f.get('break')),h=dhootHours(start,end,breaks);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isInteger(breaks)||breaks<0||h<=0||h>24){alert('Check date, shift times, and unpaid break.');return;}dhootWorkBusy=true;try{const {error}=await sb.from('dhoot_work_shifts').insert({user_id:await getUserId(),work_date:date,start_time:start,end_time:end,break_minutes:breaks,paid_hours:Math.round(h*100)/100});if(error)throw error;await dhootLoadWork();renderMain();}catch(err){alert('Could not save shift: '+err.message)}finally{dhootWorkBusy=false}}
async function dhootSaveRate(e){e.preventDefault();if(dhootWorkBusy)return;const f=new FormData(e.target),rate=Number(f.get('rate')),date=String(f.get('date'));if(!Number.isFinite(rate)||rate<0||rate>10000) return alert('Enter a valid rate.');dhootWorkBusy=true;try{const {error}=await sb.from('dhoot_work_rates').insert({user_id:await getUserId(),effective_date:date,hourly_rate:rate});if(error)throw error;await dhootLoadWork();renderMain()}catch(err){alert('Could not save rate: '+err.message)}finally{dhootWorkBusy=false}}
async function dhootClockAction(action){if(dhootWorkBusy)return;dhootWorkBusy=true;try{const {data,error}=await sb.rpc('dhoot_clock_action',{p_action:action});if(error)throw error;await dhootLoadWork();renderMain();}catch(err){alert('Clock action failed: '+err.message+' — refresh before retrying to avoid duplicate actions.')}finally{dhootWorkBusy=false}}
async function dhootDeleteShift(id){if(!confirm('Delete this shift record?'))return;const {error}=await sb.from('dhoot_work_shifts').delete().eq('id',id);if(error)return alert(error.message);await dhootLoadWork();renderMain()}
function dhootExportShifts(){const calc=dhootBreakdown(),cols=['Date','Start','End','Break minutes','Paid hours','Hourly rate','Daily overtime hours','Estimated gross'];const safe=v=>'"'+String(v??'').replace(/"/g,'""').replace(/^([=+@-])/,'\'$1')+'"';const lines=[cols,...dhootWork.map(s=>{const b=calc.get(s.id)||{};return [s.work_date,s.start_time,s.end_time,s.break_minutes,s.paid_hours,b.rate,b.ot,b.gross]})].map(r=>r.map(safe).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([lines],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='Dhoot-work-shifts.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
async function dhootCopySQL(){const el=document.getElementById('dhoot-sql-view');el.style.display='block';el.value=document.getElementById('dhoot-db-sql').textContent;try{await navigator.clipboard.writeText(el.value);alert('SQL copied. Run in your existing Supabase SQL Editor after taking a backup.')}catch{el.select()}}
</script>
